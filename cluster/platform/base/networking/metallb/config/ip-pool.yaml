apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.1.230-192.168.1.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
  - default-pool
  interfaces:
  # Control-plane nodes use enp195s0 or enp196s0; Eva storage nodes use
  # enp5s0f1np1. Every speaker eligible for L2 leader election must have one
  # of the selected interfaces or its LoadBalancer IP will not answer ARP.
  - enp195s0
  - enp196s0
  - enp5s0f1np1
