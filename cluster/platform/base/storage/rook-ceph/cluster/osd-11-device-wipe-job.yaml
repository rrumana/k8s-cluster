apiVersion: batch/v1
kind: Job
metadata:
  name: rook-ceph-wipe-osd-11-device
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rook-ceph-wipe-osd-device
        ceph-osd-id: "11"
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: eva-3
      tolerations:
        - key: homelab.rcrumana.xyz/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: wipe-device
          image: quay.io/ceph/ceph:v20.2.2
          securityContext:
            privileged: true
            runAsUser: 0
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
            - |
              target=/dev/disk/by-id/nvme-Samsung_SSD_990_PRO_4TB_S7KGNU0Y209802J
              expected_device=/dev/nvme2n1
              expected_serial=S7KGNU0Y209802J

              # The preceding sync wave purges OSD 11 and deletes its deployment.
              # Give kubelet a short grace period to finish releasing the device.
              sleep 15

              resolved="$(readlink -f "$target")"
              test "$resolved" = "$expected_device"

              device_name="$(basename "$resolved")"
              actual_serial="$(tr -d '[:space:]' < "/sys/block/$device_name/device/serial")"
              test "$actual_serial" = "$expected_serial"

              existing_type="$(blkid -s TYPE -o value "$target")"
              test "$existing_type" = ceph_bluestore

              echo "Wiping retired OSD 11 from $target ($actual_serial)"
              ceph-bluestore-tool zap-device \
                --dev "$target" \
                --yes-i-really-really-mean-it
              sgdisk --zap-all "$target"
              wipefs --all --force "$target"
              blockdev --rereadpt "$target" || true

              remaining="$(wipefs --noheadings --output TYPE "$target")"
              test -z "$remaining"
              echo "Device signatures removed successfully"
          volumeMounts:
            - name: host-dev
              mountPath: /dev
            - name: host-sys
              mountPath: /sys
              readOnly: true
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
