apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-gitea-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: valkey-gitea-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: apps/development/gitea-valkey
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-gitea-harbor-pull-creds
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: valkey-gitea-harbor-pull-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: apps/productivity/harbor-pull-creds
        property: .dockerconfigjson
