fullnameOverride: qdrant

replicaCount: 3
minReadySeconds: 10

image:
  repository: harbor.rcrumana.xyz/mirror/qdrant/qdrant
  tag: v1.18.2
  pullPolicy: IfNotPresent
  useUnprivilegedImage: true

imagePullSecrets:
  - name: harbor-pull-creds

podAnnotations:
  linkerd.io/inject: disabled
  # Increment through GitOps after a TLS or API-key rotation. Qdrant reloads
  # REST certificates, but gRPC/peer TLS and environment variables need a pod
  # restart.
  qdrant.rcrumana.xyz/rollout-revision: "1"

additionalLabels:
  app.kubernetes.io/part-of: data-platform

service:
  type: ClusterIP
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
      checksEnabled: true
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
      checksEnabled: false
    - name: p2p
      port: 6335
      targetPort: 6335
      protocol: TCP
      checksEnabled: false

ingress:
  enabled: false

startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

resources:
  requests:
    cpu: "1"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 3000
  fsGroupChangePolicy: OnRootMismatch
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# The unprivileged image and fsGroup make the chart's root chown init container
# unnecessary.
updateVolumeFsOwnership: false

terminationGracePeriodSeconds: 120

nodeSelector:
  homelab.rcrumana.xyz/node-plane: storage

tolerations:
  - key: homelab.rcrumana.xyz/storage
    operator: Equal
    value: "true"
    effect: NoSchedule

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: qdrant
            app.kubernetes.io/instance: qdrant
        topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/instance: qdrant

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: IfHealthyBudget

persistence:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block-app-replicated
  size: 50Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep

# Qdrant uses this path for explicit snapshots and snapshot-based shard
# transfers. Durable off-cluster copies remain the responsibility of VolSync.
snapshotPersistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block-app-replicated
  size: 50Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep

env:
  - name: QDRANT__SERVICE__API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-api-keys
        key: api-key
  - name: QDRANT__SERVICE__READ_ONLY_API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-api-keys
        key: read-only-api-key

config:
  storage:
    collection:
      # Distributed mode alone does not replicate collection data. These are
      # safe defaults for collections that do not override their own layout.
      replication_factor: 2
      write_consistency_factor: 1
      shard_number_per_node: 2
      strict_mode:
        enabled: true
  service:
    enable_cors: false
    enable_tls: true
    jwt_rbac: true
    enforce_internal_auth: true
    enable_snapshot_url_recovery: false
  cluster:
    enabled: true
    p2p:
      port: 6335
      enable_tls: true
    consensus:
      tick_period_ms: 100
  telemetry_disabled: true
  tls:
    cert: /qdrant/tls/tls.crt
    key: /qdrant/tls/tls.key
    ca_cert: /qdrant/tls/ca.crt
    cert_ttl: 3600

additionalVolumes:
  - name: qdrant-tls
    secret:
      secretName: qdrant-tls
      defaultMode: 0440

additionalVolumeMounts:
  - name: qdrant-tls
    mountPath: /qdrant/tls
    readOnly: true

# Native TLS requires a custom ServiceMonitor with a CA and a Vault-projected
# bearer token, so the chart's HTTP-only monitor is disabled.
metrics:
  serviceMonitor:
    enabled: false

# Argo skips Helm test hooks, but pin and mirror the transitive test image so
# chart rendering remains fully covered by the artifact promotion checks.
chartTests:
  dbInteraction:
    image: harbor.rcrumana.xyz/mirror/suse-bci/bci-base:16.1
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 100m
        memory: 200Mi
