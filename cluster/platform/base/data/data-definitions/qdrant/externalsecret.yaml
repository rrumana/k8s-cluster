apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qdrant-api-keys
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: qdrant-api-keys
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: apps/databases/qdrant-api-keys
        property: api-key
    - secretKey: read-only-api-key
      remoteRef:
        key: apps/databases/qdrant-api-keys
        property: read-only-api-key
