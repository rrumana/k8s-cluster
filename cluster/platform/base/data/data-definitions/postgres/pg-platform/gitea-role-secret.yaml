apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-postgres-role
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-postgres-role
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: gitea
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: apps/development/gitea-postgresql
        property: password
