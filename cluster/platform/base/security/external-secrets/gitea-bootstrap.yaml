apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gitea-opensearch-password
  namespace: security
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  length: 32
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  encoding: hex
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gitea-opensearch-password
  namespace: security
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  template:
    engineVersion: v2
    data:
      # Vault treats a property-less JSON value as one secret map, so the
      # password and its derived hash are created atomically. This avoids a
      # usable password ever being paired with a hash from another reconcile.
      credentials: |-
        {
          "password": "{{ .password }}",
          "passwordHash": "{{ trimPrefix "gitea:" (htpasswd "gitea" .password "bcrypt") }}"
        }
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: gitea-opensearch-password
  data:
    - match:
        secretKey: credentials
        remoteRef:
          remoteKey: apps/development/gitea-opensearch
