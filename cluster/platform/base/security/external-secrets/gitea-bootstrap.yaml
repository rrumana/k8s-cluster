# These one-shot generators seed durable values into Vault. IfNotExists keeps
# reconciliation and disaster recovery from rotating established credentials.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gitea-postgresql-password
  namespace: security
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  length: 32
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  encoding: hex
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gitea-postgresql-password
  namespace: security
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: gitea-postgresql-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/development/gitea-postgresql
          property: password
---
