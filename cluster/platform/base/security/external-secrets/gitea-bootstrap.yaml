apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gitea-lfs-jwt-secret
  namespace: security
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  # Gitea requires a 32-byte, unpadded base64url JWT secret.
  length: 32
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  encoding: base64url
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gitea-lfs-jwt-secret
  namespace: security
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  template:
    engineVersion: v2
    data:
      # ESO uses padded URL encoding; Gitea expects RawURLEncoding.
      value: '{{ trimSuffix "=" .password }}'
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: gitea-lfs-jwt-secret
  data:
    - match:
        secretKey: value
        remoteRef:
          remoteKey: apps/development/gitea-lfs-jwt
          property: value
---
