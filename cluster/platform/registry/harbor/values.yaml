expose:
  type: ingress
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-rcrumana-xyz-tls
  ingress:
    controller: default
    className: haproxy-restricted
    labels:
      security.rcrumana.xyz/exposure: private
    annotations:
      haproxy-ingress.github.io/backend-protocol: "http"
      haproxy-ingress.github.io/ssl-redirect: "true"
      haproxy-ingress.github.io/timeout-client: "3600s"
      haproxy-ingress.github.io/timeout-server: "3600s"
      haproxy-ingress.github.io/proxy-body-size: "0"
      haproxy-ingress.github.io/allowlist-source-range: "192.168.0.0/16,172.16.0.0/12,10.0.0.0/8,100.64.0.0/10"
    hosts:
      core: harbor.rcrumana.xyz

externalURL: https://harbor.rcrumana.xyz

storageNodeSelector: &storageNodeSelector
  homelab.rcrumana.xyz/node-plane: storage

storageTolerations: &storageTolerations
  - key: homelab.rcrumana.xyz/storage
    operator: Equal
    value: "true"
    effect: NoSchedule

updateStrategy:
  type: Recreate

existingSecretAdminPassword: harbor-core-secrets
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-core-secrets

harborAdminPassword: ""
secretKey: ""

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry-critical
      storageClass: ceph-block-critical
      accessMode: ReadWriteOnce
      size: 500Gi
    chartmuseum:
      storageClass: ceph-block-critical
      accessMode: ReadWriteOnce
      size: 5Gi
    jobservice:
      jobLog:
        existingClaim: harbor-jobservice-critical
        storageClass: ceph-block-critical
        accessMode: ReadWriteOnce
        size: 5Gi
    trivy:
      existingClaim: harbor-trivy-critical
      storageClass: ceph-block-critical
      accessMode: ReadWriteOnce
      size: 20Gi
    database:
      storageClass: ceph-block-critical
    redis:
      existingClaim: harbor-redis-critical
      storageClass: ceph-block-critical
    imageChartStorage:
      type: filesystem

chartmuseum:
  enabled: false

notary:
  enabled: false

trivy:
  enabled: true
  nodeSelector: *storageNodeSelector
  tolerations: *storageTolerations

portal:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

core:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

jobservice:
  replicas: 1
  nodeSelector: *storageNodeSelector
  tolerations: *storageTolerations
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

registry:
  replicas: 1
  nodeSelector: *storageNodeSelector
  tolerations: *storageTolerations
  registry:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "4"
        memory: 4Gi
  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

database:
  type: external
  external:
    host: pg-platform-rw.databases.svc.cluster.local
    port: 5432
    username: harbor
    coreDatabase: harbor
    existingSecret: harbor-database-secrets
    sslmode: disable

redis:
  type: internal
  internal:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

exporter:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
