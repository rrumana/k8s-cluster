# cluster/platform/ingress/haproxy/values.yaml
controller:
  configMap: haproxy-ingress-config
  image:
    registry: harbor.rcrumana.xyz
    repository: mirror/jcmoraisjr/haproxy-ingress
  imagePullSecrets:
    - name: harbor-pull-creds
  extraArgs:
    publish-service: ingress-haproxy/haproxy-ingress

  service:
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: default-pool
    loadBalancerIP: 192.168.1.230
    externalTrafficPolicy: Local

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: haproxy-ingress
          topologyKey: kubernetes.io/hostname

  config:
    ssl-redirect: "true"
    default-ssl-certificate: "ingress-haproxy/wildcard-k8s-rcrumana-xyz-tls"
    ssl-options: "no-sslv3 no-tlsv10 no-tlsv11"
    ssl-ciphers: "ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!DHE:!RSA:!AES128:!RC4:!DES:!3DES:!MD5:!DSS"
    # Apply a narrow per-source limit only to public identity entry points.
    # Normal application traffic, media streams, file synchronization, and
    # photo uploads do not match these ACLs and remain unlimited.
    config-frontend-early: |
      stick-table type ip size 100k expire 10m store http_req_rate(10s)
      acl is_private_identity_client src 192.168.0.0/16 172.16.0.0/12 10.0.0.0/8 100.64.0.0/10
      acl is_authentik_host hdr(host),field(1,:),lower -m str auth.rcrumana.xyz
      acl is_authentik_flow path_beg -i /if/flow/default-authentication-flow/ /if/flow/rcrumana-recovery/ /if/flow/rcrumana-invitation-enrollment/ /api/v3/flows/executor/default-authentication-flow/ /api/v3/flows/executor/rcrumana-recovery/ /api/v3/flows/executor/rcrumana-invitation-enrollment/
      acl is_forward_auth_host hdr(host),field(1,:),lower -m str dashboard.rcrumana.xyz hypermind.rcrumana.xyz uptime.rcrumana.xyz
      acl is_forward_auth_start path_beg -i /outpost.goauthentik.io/start
      acl is_jellyfin_host hdr(host),field(1,:),lower -m str jellyfin.rcrumana.xyz
      acl is_jellyfin_password_login path -i /Users/AuthenticateByName
      http-request track-sc0 src if !is_private_identity_client is_authentik_host is_authentik_flow
      http-request track-sc0 src if !is_private_identity_client is_forward_auth_host is_forward_auth_start
      http-request track-sc0 src if !is_private_identity_client is_jellyfin_host is_jellyfin_password_login
      http-request deny deny_status 429 if !is_private_identity_client is_authentik_host is_authentik_flow { sc_http_req_rate(0) gt 20 }
      http-request deny deny_status 429 if !is_private_identity_client is_forward_auth_host is_forward_auth_start { sc_http_req_rate(0) gt 20 }
      http-request deny deny_status 429 if !is_private_identity_client is_jellyfin_host is_jellyfin_password_login { sc_http_req_rate(0) gt 5 }
    syslog-endpoint: "stdout"
    syslog-format: "raw"
    syslog-tag: "haproxy"

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

  replicaCount: 3

  logs:
    enabled: true
    level: info
    image:
      registry: harbor.rcrumana.xyz
      repository: mirror/crisu1710/kube-syslog-sidecar

defaultBackend:
  enabled: false

serviceMonitor:
  enabled: true
  namespace: ingress-haproxy
  interval: 30s
