apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: automation

resources:
  - configmap.yaml
  - externalsecret.yaml
  - harbor-pull-creds.yaml
  - cronjob.yaml
  - promoter-cronjob.yaml

configMapGenerator:
  - name: renovate-promoter
    files:
      - promoter.mjs
      - artifact-sources.json

generatorOptions:
  disableNameSuffixHash: true
