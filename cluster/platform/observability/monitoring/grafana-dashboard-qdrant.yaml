apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-qdrant
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  qdrant.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "max": 3,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red"},
                  {"color": "orange", "value": 2},
                  {"color": "green", "value": 3}
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "expr": "sum(up{namespace=\"databases\",service=\"qdrant-headless\"})",
              "refId": "A"
            }
          ],
          "title": "Healthy Peers",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "max": 3,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red"},
                  {"color": "orange", "value": 2},
                  {"color": "green", "value": 3}
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "expr": "min(cluster_peers_total{namespace=\"databases\"})",
              "refId": "A"
            }
          ],
          "title": "Consensus Peers",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "max": 2,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red"},
                  {"color": "orange", "value": 1},
                  {"color": "green", "value": 2}
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "expr": "min(collection_active_replicas_min{namespace=\"databases\"}) and on() max(collections_total{namespace=\"databases\"}) > 0",
              "refId": "A"
            }
          ],
          "title": "Minimum Active Replicas",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green"},
                  {"color": "red", "value": 1}
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "expr": "max(collection_dead_replicas{namespace=\"databases\"})",
              "refId": "A"
            }
          ],
          "title": "Dead Replicas",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "id": 5,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "max by (id) (collection_points{namespace=\"databases\"})",
              "legendFormat": "{{id}}",
              "refId": "A"
            }
          ],
          "title": "Points by Collection",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "id": 6,
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "sum by (endpoint, status) (rate(rest_responses_total{namespace=\"databases\"}[5m]))",
              "legendFormat": "{{status}} {{endpoint}}",
              "refId": "A"
            },
            {
              "expr": "sum by (endpoint, status) (rate(grpc_responses_total{namespace=\"databases\"}[5m]))",
              "legendFormat": "gRPC {{status}} {{endpoint}}",
              "refId": "B"
            }
          ],
          "title": "Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "id": 7,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "memory_resident_bytes{namespace=\"databases\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Resident Memory by Peer",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "max": 100,
              "min": 0,
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "id": 8,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "100 * kubelet_volume_stats_used_bytes{namespace=\"databases\",persistentvolumeclaim=~\"qdrant-(storage|snapshots)-qdrant-[0-2]\"} / kubelet_volume_stats_capacity_bytes{namespace=\"databases\",persistentvolumeclaim=~\"qdrant-(storage|snapshots)-qdrant-[0-2]\"}",
              "legendFormat": "{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "title": "PVC Utilization",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["qdrant", "databases"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Qdrant Cluster",
      "uid": "qdrant-cluster",
      "version": 1
    }
