apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
spec:
  template:
    metadata:
      annotations:
        media.rcrumana.xyz/identity-config-revision: "2026-08-14-disable-password-login"
    spec:
      containers:
        - name: immich-server
          env:
            - name: IMMICH_CONFIG_FILE
              value: /etc/immich/immich.json
          volumeMounts:
            - name: identity-config
              mountPath: /etc/immich
              readOnly: true
      volumes:
        - name: identity-config
          secret:
            secretName: immich-identity-config
            items:
              - key: immich.json
                path: immich.json
