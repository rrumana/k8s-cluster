apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      annotations:
        media.rcrumana.xyz/identity-revision: "2026-08-05-sso-auth-4.0.0.4"
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        kubernetes.io/hostname: eva-3
      tolerations:
        - key: homelab.rcrumana.xyz/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: plex
              topologyKey: kubernetes.io/hostname
      securityContext:
        supplementalGroups:
          - 989
          - 985
      initContainers:
        - name: install-sso-plugin
          image: harbor.rcrumana.xyz/proxy-dockerhub/curlimages/curl:8.21.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -ec
          args:
            - |
              version="4.0.0.4"
              expected_sha256="c09f16ba31059a434ddd7f811e4f9608d4b4c4514cc80a5bf1ca33bee61e1107"
              target="/config/data/plugins/SSO Authentication_${version}"

              if [ -f "${target}/SSO-Auth.dll" ]; then
                echo "install-sso-plugin: ${version} already installed"
                exit 0
              fi

              archive="/tmp/sso-authentication.zip"
              stage="/tmp/sso-authentication"
              mkdir -p "$stage"
              curl -fL --retry 5 --retry-delay 2 \
                "https://github.com/9p4/jellyfin-plugin-sso/releases/download/v${version}/sso-authentication_${version}.zip" \
                -o "$archive"
              printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum -c -
              unzip -q "$archive" -d "$stage"
              test -f "$stage/SSO-Auth.dll"

              mkdir -p "$target"
              cp -a "$stage/." "$target/"
              test -f "${target}/SSO-Auth.dll"
              chown -R 1000:1000 "$target"
              echo "install-sso-plugin: installed ${version}"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: harbor.rcrumana.xyz/mirror/linuxserver/jellyfin:10.11.3ubu2404-ls9
          securityContext:
            privileged: true
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Los_Angeles"
            - name: JELLYFIN_PublishedServerUrl
              value: "https://jellyfin.rcrumana.xyz"
            - name: LIBVA_DRIVER_NAME
              value: radeonsi
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
            - name: https
              containerPort: 8920
              protocol: TCP
            - name: discovery
              containerPort: 7359
              protocol: UDP
            - name: dlna
              containerPort: 1900
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media-library
              mountPath: /tv
              subPath: Torrent/Shows
            - name: media-library
              mountPath: /movies
              subPath: Torrent/Movies
            - name: media-library
              mountPath: /music
              subPath: Torrent/Music
          resources:
            requests:
              memory: "4Gi"
              cpu: "500m"
            limits:
              memory: "12Gi"
              cpu: "24"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-critical
        - name: cache
          emptyDir: {}
        - name: media-library
          persistentVolumeClaim:
            claimName: media-library-bulk
