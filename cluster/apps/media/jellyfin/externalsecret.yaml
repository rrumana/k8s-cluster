apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-identity
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: jellyfin-identity
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/media/jellyfin-identity
        property: client-secret
    # Reuse the existing dashboard integration key for the one-time plugin and
    # branding bootstrap. No additional Jellyfin robot credential is needed.
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: apps/productivity/homepage-env
        property: HOMEPAGE_VAR_JELLYFIN_API_KEY
