apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

resources:
  - serviceaccount.yaml
  - externalsecret.yaml
  - system-config-externalsecret.yaml
  - server-deployment.yaml
  - ml-deployment.yaml
  - services.yaml
  - networkpolicy.yaml
  - configmap.yaml
  - pvc.yaml
  - vpa.yaml

labels:
  - pairs:
      app.kubernetes.io/name: immich
      app.kubernetes.io/managed-by: argocd
    includeSelectors: true
