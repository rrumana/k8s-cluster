apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app: immich
    component: server
spec:
  replicas: 1
  progressDeadlineSeconds: 86400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich
      component: server
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/skip-outbound-ports: "6379"
        media.rcrumana.xyz/identity-config-revision: "2026-08-14-disable-password-login"
      labels:
        app: immich
        component: server
    spec:
      serviceAccountName: immich-server
      terminationGracePeriodSeconds: 120
      containers:
        - name: immich-server
          image: harbor.rcrumana.xyz/proxy-ghcr/immich-app/immich-server:v3.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2283
              name: http
          env:
            - name: IMMICH_CONFIG_FILE
              value: /etc/immich/immich.json
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secret
          volumeMounts:
            - name: identity-config
              mountPath: /etc/immich
              readOnly: true
            - name: upload
              mountPath: /usr/src/app/upload
            - name: dri
              mountPath: /dev/dri
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "48Gi"
              cpu: "24"
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: identity-config
          secret:
            secretName: immich-identity-config
            items:
              - key: immich.json
                path: immich.json
        - name: upload
          persistentVolumeClaim:
            claimName: immich-photos-critical
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
