apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-identity-config
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: immich-identity-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        immich.json: >-
          {{- $config := fromJson .config -}}
          {{- $_ := set $config.passwordLogin "enabled" false -}}
          {{ $config | toJson }}
  data:
    - secretKey: config
      remoteRef:
        # Retain the established Vault location; moving this manifest does not
        # require copying or reseeding secret material.
        key: apps/media/immich-identity
        property: config.json
