apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  labels: { app: arr-stack }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: arr-stack }
  template:
    metadata:
      annotations:
        media.rcrumana.xyz/gluetun-credentials-version: "10"
        media.rcrumana.xyz/pf-sync-config-version: "3"
        media.rcrumana.xyz/seerr-identity-revision: "2026-08-14-quick-connect-only"
      labels:
        app: arr-stack
        traffic-tier: bulk-seed
    spec:
      terminationGracePeriodSeconds: 180
      nodeSelector:
        kubernetes.io/hostname: eva-3
      tolerations:
        - key: homelab.rcrumana.xyz/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.45.0.10
        options:
          - name: ndots
            value: "2"
      volumes:
        - name: dev-net-tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
        - name: gluetun
          persistentVolumeClaim:
            claimName: arr-stack-gluetun-critical
        - name: qbit-config
          persistentVolumeClaim:
            claimName: arr-stack-qbit-config-critical
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: arr-stack-sonarr-config-critical
        - name: radarr-config
          persistentVolumeClaim:
            claimName: arr-stack-radarr-config-critical
        - name: lidarr-config
          persistentVolumeClaim:
            claimName: arr-stack-lidarr-config-critical
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: arr-stack-prowlarr-config-critical
        - name: jellyseerr-config
          persistentVolumeClaim:
            claimName: arr-stack-jellyseerr-config-critical
        - name: patched-seerr-next
          emptyDir:
            sizeLimit: 128Mi
        - name: media
          persistentVolumeClaim:
            claimName: media-library-bulk-torrent-eva-3
        - name: temp
          hostPath: { path: /var/lib/qbit-temp, type: DirectoryOrCreate }
        - name: pf-state
          emptyDir: {}
        - name: pf-sync
          configMap:
            name: arr-stack-gluetun-pf-sync
            defaultMode: 0755

      initContainers:
        - name: sysctl-init
          image: harbor.rcrumana.xyz/proxy-dockerhub/library/busybox:1.38
          securityContext:
            privileged: true
          command: ["sh","-c",<<-'EOS'
            set -eux
            sysctl -w net.ipv4.conf.all.rp_filter=0
            sysctl -w net.ipv4.conf.default.rp_filter=0
            sysctl -w net.ipv4.conf.tun0.rp_filter=0 || true
            EOS]
        - name: fix-perms
          image: harbor.rcrumana.xyz/proxy-dockerhub/library/busybox:1.38
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              set -eux
              echo "fix-perms: listing /config and /gluetun (if mounted)"
              ls -la /config 2>/dev/null || true
              find /config -maxdepth 2 -type f -print 2>/dev/null || true
              ls -la /temp 2>/dev/null || true
              if [ -f /config/qBittorrent/qBittorrent.conf ]; then
                echo "fix-perms: found /config/qBittorrent/qBittorrent.conf"
              else
                echo "fix-perms: qBittorrent.conf missing"
              fi
              # These paths contain a PID and pod hostname. An unclean node or
              # pod shutdown leaves them on the PVC, causing qBittorrent to
              # treat every replacement pod as a duplicate instance. No app
              # containers are running during init, so they are always stale.
              if [ -e /config/qBittorrent/lockfile ]; then
                echo "fix-perms: removing stale qBittorrent process lock"
                rm -f /config/qBittorrent/lockfile
              fi
              if [ -e /config/qBittorrent/qBittorrent-data.conf.lock ]; then
                echo "fix-perms: removing stale qBittorrent data lock"
                rm -f /config/qBittorrent/qBittorrent-data.conf.lock
              fi
              if [ -e /config/qBittorrent/ipc-socket ] || [ -S /config/qBittorrent/ipc-socket ]; then
                echo "fix-perms: removing stale qBittorrent IPC socket"
                rm -f /config/qBittorrent/ipc-socket
              fi
              if [ -f /gluetun/servers.json ] && [ ! -s /gluetun/servers.json ]; then
                echo "fix-perms: removing empty /gluetun/servers.json"
                rm -f /gluetun/servers.json
              fi
              mkdir -p /temp
              mkdir -p /seerr-config/logs
              chown -R 1000:1000 /config /gluetun /temp /seerr-config 2>/dev/null || true
              chmod -R u+rwX,g+rwX /config /gluetun /temp /seerr-config 2>/dev/null || true
          volumeMounts:
            - { name: qbit-config, mountPath: /config }
            - { name: gluetun,     mountPath: /gluetun }
            - { name: temp,        mountPath: /temp }
            - { name: jellyseerr-config, mountPath: /seerr-config }
        - name: configure-seerr-identity
          image: harbor.rcrumana.xyz/proxy-ghcr/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -ec
          args:
            - |
              node <<'NODE'
              const fs = require('fs');
              const path = '/app/config/settings.json';
              const temporaryPath = `${path}.identity.tmp`;
              const settings = JSON.parse(fs.readFileSync(path, 'utf8'));

              settings.main.localLogin = false;
              settings.main.mediaServerLogin = false;
              settings.main.newPlexLogin = true;
              settings.main.applicationUrl = 'https://jellyseerr.rcrumana.xyz';

              fs.writeFileSync(temporaryPath, `${JSON.stringify(settings, null, 2)}\n`, {
                mode: 0o600,
              });
              fs.renameSync(temporaryPath, path);
              console.log('Seerr identity settings configured: Quick Connect only');
              NODE
          volumeMounts:
            - { name: jellyseerr-config, mountPath: /app/config }
        - name: patch-seerr-login
          # Seerr 3.4.1 has no Quick Connect-only UI mode: disabling media
          # server login rejects password authentication but leaves the form
          # visible. Patch and cache-bust the pinned client assets separately.
          image: harbor.rcrumana.xyz/proxy-ghcr/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # Hand the completed emptyDir tree to Seerr's runtime UID.
                - CHOWN
          command:
            - /bin/sh
            - -ec
          args:
            - |
              # Keep the copied tree root-owned while it is being edited. The
              # finished tree is handed to Seerr's runtime UID below.
              cp -R /app/.next/. /patched-next/

              stylesheets=0
              for stylesheet in /patched-next/static/chunks/*.css; do
                test -f "$stylesheet" || continue
                original_name=$(basename "$stylesheet")
                patched_name="${original_name%.css}.quick-connect.css"
                patched_stylesheet="$(dirname "$stylesheet")/${patched_name}"

                printf '\nform[data-form-type="login"]{display:none!important}\n' >> "$stylesheet"
                mv "$stylesheet" "$patched_stylesheet"

                references=$(grep -rlF "$original_name" /patched-next 2>/dev/null || true)
                if [ -z "$references" ]; then
                  echo "Seerr client patch found no references to ${original_name}" >&2
                  exit 1
                fi
                escaped_original=$(printf '%s' "$original_name" | sed 's/\./\\./g')
                printf '%s\n' "$references" | while IFS= read -r reference; do
                  sed -i "s/${escaped_original}/${patched_name}/g" "$reference"
                done

                if grep -rlF "$original_name" /patched-next >/dev/null 2>&1; then
                  echo "Seerr client patch left stale references to ${original_name}" >&2
                  exit 1
                fi
                stylesheets=$((stylesheets + 1))
              done

              if [ "$stylesheets" -lt 1 ]; then
                echo "Seerr client patch found no stylesheets" >&2
                exit 1
              fi
              chown -R 1000:1000 /patched-next
              echo "Seerr Quick Connect-only client patch applied to ${stylesheets} stylesheets"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: patched-seerr-next
              mountPath: /patched-next
        - name: install-vuetorrent
          image: harbor.rcrumana.xyz/mirror/linuxserver/qbittorrent:5.2.3_v2.0.13-ls469
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              set -eu
              version="v2.31.0"
              expected_sha256="ad213f4479a232ae27b410b082b622ac2d06661cab063c2d240fbd255083ddab"
              target="/config/vuetorrent-${version}"

              if [ -f "${target}/public/index.html" ]; then
                echo "install-vuetorrent: ${version} already installed"
                exit 0
              fi

              archive="/tmp/vuetorrent.zip"
              stage="/tmp/vuetorrent-stage"
              mkdir -p "$stage"
              curl -fL --retry 5 --retry-delay 2 \
                "https://github.com/VueTorrent/VueTorrent/releases/download/${version}/vuetorrent.zip" \
                -o "$archive"
              printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum -c -
              unzip -q "$archive" -d "$stage"
              test -f "$stage/vuetorrent/public/index.html"

              mkdir -p "$target"
              cp -a "$stage/vuetorrent/." "$target/"
              test -f "${target}/public/index.html"
              chown -R 1000:1000 "$target"
              echo "install-vuetorrent: installed ${version}"
          volumeMounts:
            - { name: qbit-config, mountPath: /config }

      containers:
        - name: gluetun
          image: harbor.rcrumana.xyz/mirror/qmcgaw/gluetun:v3.41.3
          securityContext:
            privileged: true
            capabilities: { add: ["NET_ADMIN"] }
          envFrom:
            - secretRef: { name: gluetun-env }
          env:
            - { name: FIREWALL_INPUT_PORTS, value: "8020,8989,7878,9696,8686,8191,5055" }
            - { name: HEALTH_TARGET_ADDRESS, value: "127.0.0.1:9999" }
            - { name: VPN_PORT_FORWARDING_STATUS_FILE, value: "/pf/state/forwarded_port" }
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "10.44.0.0/16,10.45.0.0/16" }
            - { name: BLOCK_IPV6, value: "on" }
          volumeMounts:
            - { name: dev-net-tun, mountPath: /dev/net/tun }
            - { name: gluetun, mountPath: /gluetun }
            - { name: pf-state, mountPath: /pf/state }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1", memory: "512Mi" }

        - name: pf-sync
          image: harbor.rcrumana.xyz/proxy-dockerhub/curlimages/curl:8.21.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-c","/scripts/pf-sync.sh"]
          env:
            - { name: PF_FILE, value: "/pf/state/forwarded_port" }
            - { name: QB_WEBUI_PORT, value: "8020" }
            # Temporarily disabled for live qBittorrent performance testing.
            # Port forwarding and interface reconciliation remain enabled.
            - { name: QB_RECONCILE_PERFORMANCE, value: "false" }
            - { name: QB_GLOBAL_UPLOAD_SLOTS, value: "128" }
            - { name: QB_UPLOAD_SLOTS_PER_TORRENT, value: "8" }
            - { name: QB_DISK_IO_TYPE, value: "3" }
            - { name: QB_ASYNC_IO_THREADS, value: "4" }
            - { name: QB_HASHING_THREADS, value: "4" }
            - { name: QB_SEND_BUFFER_LOW_WATERMARK, value: "32" }
            - { name: QB_SEND_BUFFER_WATERMARK, value: "128" }
            - { name: QB_SEND_BUFFER_WATERMARK_FACTOR, value: "250" }
            - { name: QB_ALTERNATIVE_WEBUI_ENABLED, value: "true" }
            - { name: QB_ALTERNATIVE_WEBUI_PATH, value: "/config/vuetorrent-v2.31.0" }
            - { name: QB_USERNAME, valueFrom: { secretKeyRef: { name: qb-webui-creds, key: username } } }
            - { name: QB_PASSWORD, valueFrom: { secretKeyRef: { name: qb-webui-creds, key: password } } }
          volumeMounts:
            - { name: pf-sync, mountPath: /scripts/pf-sync.sh, subPath: pf-sync.sh }
            - { name: pf-state, mountPath: /pf/state }
          resources:
            requests: { cpu: "5m", memory: "16Mi" }
            limits:   { cpu: "25m", memory: "64Mi" }

        - name: qbittorrent
          image: harbor.rcrumana.xyz/mirror/linuxserver/qbittorrent:5.2.3_v2.0.13-ls469
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/Los_Angeles" }
            - { name: WEBUI_PORT, value: "8020" }
            - { name: TORRENTING_PORT, value: "6881" }
          ports:
            - { name: webui, containerPort: 8020, protocol: TCP }
          readinessProbe:
            exec:
              command: ["sh", "-c", "nc -z 127.0.0.1 8020"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - { name: qbit-config, mountPath: /config }
            - { name: media,       mountPath: /media }
            - { name: temp,        mountPath: /temp }
          resources:
            requests: { cpu: "300m", memory: "2Gi" }
            limits:   { cpu: "2", memory: "8Gi" }

        - name: sonarr
          image: harbor.rcrumana.xyz/mirror/linuxserver/sonarr:4.0.19.2979-ls320
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/Los_Angeles" }
          volumeMounts:
            - { name: sonarr-config, mountPath: /config }
            - { name: media,         mountPath: /media }
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits:   { cpu: "2", memory: "2Gi" }

        - name: radarr
          image: harbor.rcrumana.xyz/mirror/linuxserver/radarr:6.3.0.10514-ls313
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/Los_Angeles" }
          volumeMounts:
            - { name: radarr-config, mountPath: /config }
            - { name: media,         mountPath: /media }
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits:   { cpu: "2", memory: "2Gi" }

        - name: lidarr
          image: harbor.rcrumana.xyz/mirror/linuxserver/lidarr:3.1.0.4875-ls38
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/Los_Angeles" }
          volumeMounts:
            - { name: lidarr-config, mountPath: /config }
            - { name: media,         mountPath: /media }
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits:   { cpu: "2", memory: "2Gi" }

        - name: prowlarr
          image: harbor.rcrumana.xyz/mirror/linuxserver/prowlarr:2.5.2.5491-ls156
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "America/Los_Angeles" }
            - { name: DOTNET_SYSTEM_NET_DISABLEIPV6, value: "1" }
          volumeMounts:
            - { name: prowlarr-config, mountPath: /config }
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits:   { cpu: "2", memory: "2Gi" }

        - name: jellyseerr
          image: harbor.rcrumana.xyz/proxy-ghcr/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
          env:
            - { name: TZ,   value: "America/Los_Angeles" }
            - { name: DB_TYPE, value: "postgres" }
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: arr-postgres-config
                  key: JELLYSEERR_DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: arr-postgres-config
                  key: JELLYSEERR_DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: arr-postgres-config
                  key: JELLYSEERR_DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-secret
                  key: JELLYSEERR_DB_PASS
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: arr-postgres-config
                  key: JELLYSEERR_DB_NAME
          ports:
            - { name: http, containerPort: 5055, protocol: TCP }
          volumeMounts:
            - { name: jellyseerr-config, mountPath: /app/config }
            - { name: patched-seerr-next, mountPath: /app/.next }
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits:   { cpu: "2", memory: "2Gi" }

        - name: flaresolverr
          image: harbor.rcrumana.xyz/proxy-ghcr/flaresolverr/flaresolverr:v3.5.0
          env:
            - { name: LOG_LEVEL, value: "info" }
            - { name: LOG_HTML,  value: "false" }
            - { name: CAPTCHA_SOLVER, value: "none" }
            - { name: TZ,   value: "America/Los_Angeles" }
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits:   { cpu: "2", memory: "2Gi" }
