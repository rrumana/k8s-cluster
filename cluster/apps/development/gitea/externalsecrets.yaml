apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull-creds
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-pull-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: apps/productivity/harbor-pull-creds
        property: .dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: gitea
        secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: apps/development/gitea-oidc
        property: secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-app-ini-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-app-ini-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database: |-
          DB_TYPE = postgres
          HOST = pg-platform-rw.databases.svc.cluster.local:5432
          NAME = gitea
          USER = gitea
          PASSWD = {{ .postgresPassword }}
          SSL_MODE = require
          MAX_OPEN_CONNS = 30
          MAX_IDLE_CONNS = 10
          CONN_MAX_LIFETIME = 3m
        # Gitea keeps the protocol-compatible adapter name "redis" even when
        # the backing service is Valkey. Keep comments outside the fragment:
        # the chart's env-to-ini importer expects every line to be KEY = value.
        cache: |-
          ENABLED = true
          ADAPTER = redis
          HOST = redis+sentinel://:{{ .valkeyPassword }}@valkey-gitea-node-0.valkey-gitea-headless.databases.svc.cluster.local:26379,valkey-gitea-node-1.valkey-gitea-headless.databases.svc.cluster.local:26379,valkey-gitea-node-2.valkey-gitea-headless.databases.svc.cluster.local:26379/0?mastername=gitea&sentinelpassword={{ .valkeyPassword }}
        session: |-
          PROVIDER = redis
          PROVIDER_CONFIG = redis+sentinel://:{{ .valkeyPassword }}@valkey-gitea-node-0.valkey-gitea-headless.databases.svc.cluster.local:26379,valkey-gitea-node-1.valkey-gitea-headless.databases.svc.cluster.local:26379,valkey-gitea-node-2.valkey-gitea-headless.databases.svc.cluster.local:26379/1?mastername=gitea&sentinelpassword={{ .valkeyPassword }}
        queue: |-
          TYPE = redis
          CONN_STR = redis+sentinel://:{{ .valkeyPassword }}@valkey-gitea-node-0.valkey-gitea-headless.databases.svc.cluster.local:26379,valkey-gitea-node-1.valkey-gitea-headless.databases.svc.cluster.local:26379,valkey-gitea-node-2.valkey-gitea-headless.databases.svc.cluster.local:26379/2?mastername=gitea&sentinelpassword={{ .valkeyPassword }}
        global_lock: |-
          SERVICE_TYPE = redis
          SERVICE_CONN_STR = redis+sentinel://:{{ .valkeyPassword }}@valkey-gitea-node-0.valkey-gitea-headless.databases.svc.cluster.local:26379,valkey-gitea-node-1.valkey-gitea-headless.databases.svc.cluster.local:26379,valkey-gitea-node-2.valkey-gitea-headless.databases.svc.cluster.local:26379/3?mastername=gitea&sentinelpassword={{ .valkeyPassword }}
        cron.git_gc_repos: |-
          ENABLED = false
        security: |-
          SECRET_KEY = {{ .secretKey }}
          INTERNAL_TOKEN = {{ .internalToken }}
        server: |-
          LFS_JWT_SECRET = {{ .lfsJwtSecret }}
        oauth2: |-
          JWT_SECRET = {{ .oauth2JwtSecret }}
        indexer: |-
          ISSUE_INDEXER_CONN_STR = https://gitea:{{ .opensearchPassword }}@opensearch-logs.search.svc.cluster.local:9200
          REPO_INDEXER_CONN_STR = https://gitea:{{ .opensearchPassword }}@opensearch-logs.search.svc.cluster.local:9200
  data:
    - secretKey: postgresPassword
      remoteRef:
        key: apps/development/gitea-postgresql
        property: password
    - secretKey: valkeyPassword
      remoteRef:
        key: apps/development/gitea-valkey
        property: password
    - secretKey: secretKey
      remoteRef:
        key: apps/development/gitea-secret-key
        property: value
    - secretKey: internalToken
      remoteRef:
        key: apps/development/gitea-internal-token
        property: value
    - secretKey: lfsJwtSecret
      remoteRef:
        key: apps/development/gitea-lfs-jwt
        property: value
    - secretKey: oauth2JwtSecret
      remoteRef:
        key: apps/development/gitea-oauth2-jwt
        property: value
    - secretKey: opensearchPassword
      remoteRef:
        key: apps/development/gitea-opensearch
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-opensearch-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: opensearch-ca
    kind: ClusterSecretStore
  target:
    name: gitea-opensearch-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: opensearch-logs-ca
        property: ca.crt
