apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-admin-migration
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-admin-migration
        app.kubernetes.io/instance: gitea-admin-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: harbor.rcrumana.xyz/mirror/gitea/gitea:1.27.0@sha256:caa57d932c7b78eb19b638dc38fd7c2f5512d4f90d8369c680a73bebf1b1de28
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          command:
            - /bin/sh
            - -ec
          args:
            - |
              target_user="admin"
              legacy_admin="gitea-admin"
              transient_admin="gitops-admin-migration"
              api_base="http://gitea-http.development.svc.cluster.local:3000/api/v1"

              user_exists() {
                gitea admin user list | awk -v username="$1" \
                  'NR > 1 && $2 == username { found = 1 } END { exit(found ? 0 : 1) }'
              }

              user_is_admin() {
                gitea admin user list --admin | awk -v username="$1" \
                  'NR > 1 && $2 == username { found = 1 } END { exit(found ? 0 : 1) }'
              }

              delete_user_if_present() {
                if user_exists "$1"; then
                  gitea admin user delete --username "$1" --purge
                fi
              }

              if ! user_exists "$target_user"; then
                echo "Gitea user '${target_user}' does not exist; complete its Authentik login and resync" >&2
                exit 1
              fi

              if user_is_admin "$target_user"; then
                delete_user_if_present "$legacy_admin"
                delete_user_if_present "$transient_admin"
                echo "Gitea user '${target_user}' is the administrator and legacy accounts are absent"
                exit 0
              fi

              if user_exists "$legacy_admin" && user_is_admin "$legacy_admin"; then
                bootstrap_admin="$legacy_admin"
              else
                delete_user_if_present "$legacy_admin"
                if user_exists "$transient_admin" && user_is_admin "$transient_admin"; then
                  bootstrap_admin="$transient_admin"
                else
                  delete_user_if_present "$transient_admin"
                  create_output=$(gitea admin user create \
                    --username "$transient_admin" \
                    --email "gitops-admin-migration@rcrumana.invalid" \
                    --random-password \
                    --random-password-length 64 \
                    --must-change-password=false \
                    --admin)
                  unset create_output
                  bootstrap_admin="$transient_admin"
                fi
              fi

              migration_token=$(gitea admin user generate-access-token \
                --username "$bootstrap_admin" \
                --token-name "promote-authentik-admin-$(date +%s)-$$" \
                --scopes write:admin,read:user \
                --raw)

              account_json=$(curl -fsS \
                -H "Authorization: token ${migration_token}" \
                "${api_base}/users/${target_user}")
              source_id=$(printf '%s' "$account_json" | sed -n \
                's/.*"source_id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
              login_name=$(printf '%s' "$account_json" | sed -n \
                's/.*"login_name":[[:space:]]*"\([^"]*\)".*/\1/p')

              case "$source_id" in
                ''|*[!0-9]*)
                  echo "Could not determine the authentication source for '${target_user}'" >&2
                  exit 1
                  ;;
              esac
              if [ "$source_id" -eq 0 ] || \
                 ! printf '%s' "$login_name" | grep -Eq '^[[:alnum:]_.:@+-]+$'; then
                echo "Refusing to change '${target_user}': it is not linked to a valid external identity" >&2
                exit 1
              fi

              update_json=$(curl -fsS -X PATCH \
                -H "Authorization: token ${migration_token}" \
                -H "Content-Type: application/json" \
                --data-binary \
                "{\"source_id\":${source_id},\"login_name\":\"${login_name}\",\"admin\":true}" \
                "${api_base}/admin/users/${target_user}")
              unset migration_token account_json source_id login_name

              if ! printf '%s' "$update_json" | grep -q '"login":"admin"' || \
                 ! printf '%s' "$update_json" | grep -q '"is_admin":true'; then
                echo "Gitea API did not confirm the administrator update" >&2
                exit 1
              fi
              unset update_json

              if ! user_is_admin "$target_user"; then
                echo "Gitea CLI did not confirm '${target_user}' as an administrator" >&2
                exit 1
              fi

              delete_user_if_present "$legacy_admin"
              delete_user_if_present "$transient_admin"

              if user_exists "$legacy_admin" || ! user_is_admin "$target_user"; then
                echo "Gitea administrator migration did not reach the requested final state" >&2
                exit 1
              fi
              echo "Promoted '${target_user}' and removed '${legacy_admin}'"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: opensearch-ca
              mountPath: /etc/gitea/opensearch
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-shared-storage
        - name: opensearch-ca
          secret:
            secretName: gitea-opensearch-ca
        - name: tmp
          emptyDir: {}
