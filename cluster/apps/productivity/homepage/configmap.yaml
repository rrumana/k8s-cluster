apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    gateway: true
  proxmox.yaml: ""
  settings.yaml: |
    title: Rcrumana Cluster
    language: en
    target: _blank
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true
    disableUpdateCheck: true
    background:
      image: /images/dashboard-background.webp
      blur: sm
      saturate: 70
      brightness: 65
      opacity: 90
    cardBlur: md
    statusStyle: dot
    useEqualHeights: true
    layout:
      Acquisition:
        header: false
        style: row
        columns: 2
        Calendar:
          header: false
          style: column
          columns: 1
        Media Automation:
          header: false
          style: column
          columns: 1
      Services:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 3
      Nodes:
        style: row
        columns: 3
      Portfolio:
        style: row
        columns: 2
  services.yaml: |
    - Acquisition:
        - Calendar:
            - Calendar:
                icon: mdi-calendar-month
                widget:
                  type: calendar
                  view: monthly
                  maxEvents: 12
                  showTime: true
                  timezone: America/Los_Angeles
                  integrations:
                    - type: sonarr
                      service_group: Media Automation
                      service_name: Sonarr
                      color: teal
                      baseUrl: https://sonarr.rcrumana.xyz
                    - type: radarr
                      service_group: Media Automation
                      service_name: Radarr
                      color: amber
                      baseUrl: https://radarr.rcrumana.xyz
                    - type: lidarr
                      service_group: Media Automation
                      service_name: Lidarr
                      color: purple
                      baseUrl: https://lidarr.rcrumana.xyz
        - Media Automation:
            - Jellyseerr:
                icon: jellyseerr.png
                href: https://jellyseerr.rcrumana.xyz
                namespace: media
                podSelector: app=arr-stack
            - Sonarr:
                icon: sonarr.png
                href: https://sonarr.rcrumana.xyz
                namespace: media
                podSelector: app=arr-stack
                widget:
                  type: sonarr
                  url: http://sonarr.media.svc.cluster.local
                  key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
                  enableQueue: true
                  fields: []
                  hideErrors: true
            - Radarr:
                icon: radarr.png
                href: https://radarr.rcrumana.xyz
                namespace: media
                podSelector: app=arr-stack
                widget:
                  type: radarr
                  url: http://radarr.media.svc.cluster.local
                  key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
                  enableQueue: true
                  fields: []
                  hideErrors: true
            - Lidarr:
                icon: lidarr.png
                href: https://lidarr.rcrumana.xyz
                namespace: media
                podSelector: app=arr-stack
                widget:
                  type: lidarr
                  url: http://lidarr.media.svc.cluster.local
                  key: "{{HOMEPAGE_VAR_LIDARR_API_KEY}}"
                  fields: []
                  hideErrors: true
            - Prowlarr:
                icon: prowlarr.png
                href: https://prowlarr.rcrumana.xyz
                namespace: media
                podSelector: app=arr-stack
                widget:
                  type: prowlarr
                  url: http://prowlarr.media.svc.cluster.local
                  key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
                  fields: []
                  hideErrors: true
            - qBittorrent:
                icon: qbittorrent.png
                href: https://qbit.rcrumana.xyz
                description: Primary torrent client
                namespace: media
                podSelector: app=arr-stack
                widget:
                  type: qbittorrent
                  url: http://qbit.media.svc.cluster.local
                  username: "{{HOMEPAGE_VAR_QBIT_USERNAME}}"
                  password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
                  enableLeechProgress: true
                  enableLeechSize: true
                  fields: ["leech", "download", "seed", "upload"]
                  hideErrors: true

    - Services:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.rcrumana.xyz
            description: Media server
            namespace: media
            app: jellyfin
            widget:
              type: jellyfin
              url: http://jellyfin.media.svc.cluster.local:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
              version: 2
              enableBlocks: true
              enableNowPlaying: false
              enableUser: true
              enableMediaControl: true
              fields: ["movies", "series", "episodes"]
              hideErrors: true
        - Immich:
            icon: immich.png
            href: https://immich.rcrumana.xyz
            description: Photo library
            namespace: media
            app: immich
            widget:
              type: immich
              url: http://immich-server.media.svc.cluster.local:2283
              key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
              version: 2
              fields: ["photos", "videos", "storage"]
              hideErrors: true
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.rcrumana.xyz
            description: Files and collaboration
            namespace: productivity
            app: nextcloud
            widget:
              type: nextcloud
              url: http://nextcloud.productivity.svc.cluster.local:8080
              username: "{{HOMEPAGE_VAR_NEXTCLOUD_USERNAME}}"
              password: "{{HOMEPAGE_VAR_NEXTCLOUD_PASSWORD}}"
              fields: ["activeusers", "numfiles", "numshares", "freespace"]
              hideErrors: true
        - LibreChat:
            icon: librechat.png
            href: https://chat.rcrumana.xyz
            description: AI chat frontend
            namespace: ai
            app: librechat
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 15000
              highlight:
                Success:
                  numeric:
                    - level: danger
                      when: lt
                      value: 95
                    - level: warn
                      when: lt
                      value: 99
                    - level: good
                      when: gte
                      value: 99
                Storage:
                  numeric:
                    - level: danger
                      when: gte
                      value: 90
                    - level: warn
                      when: gte
                      value: 75
              metrics:
                - label: Requests
                  query: 'sum(rate(request_total{namespace="ai",deployment="librechat",direction="inbound",target_port="3080"}[5m])) * 60'
                  format:
                    type: number
                    suffix: " /min"
                    options:
                      maximumFractionDigits: 1
                - label: Success
                  query: '1 - ((sum(increase(response_total{namespace="ai",deployment="librechat",direction="inbound",target_port="3080",classification="failure"}[1h])) or vector(0)) / clamp_min((sum(increase(response_total{namespace="ai",deployment="librechat",direction="inbound",target_port="3080"}[1h])) or vector(0)), 1))'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 1
                - label: p95
                  query: 'histogram_quantile(0.95, sum by (le) (rate(response_latency_ms_bucket{namespace="ai",deployment="librechat",direction="inbound",target_port="3080"}[5m])))'
                  format:
                    type: number
                    suffix: " ms"
                    options:
                      maximumFractionDigits: 0
                - label: Storage
                  query: 'max(1 - kubelet_volume_stats_available_bytes{namespace="ai",persistentvolumeclaim=~"librechat-.*-critical"} / kubelet_volume_stats_capacity_bytes{namespace="ai",persistentvolumeclaim=~"librechat-.*-critical"})'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vault.rcrumana.xyz
            description: Password vault
            namespace: productivity
            app: vaultwarden
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 15000
              highlight:
                Success:
                  numeric:
                    - level: danger
                      when: lt
                      value: 95
                    - level: warn
                      when: lt
                      value: 99
                    - level: good
                      when: gte
                      value: 99
                Storage:
                  numeric:
                    - level: danger
                      when: gte
                      value: 90
                    - level: warn
                      when: gte
                      value: 75
              metrics:
                - label: Requests
                  query: 'sum(rate(request_total{namespace="productivity",deployment="vaultwarden",direction="inbound",target_port="80"}[5m])) * 60'
                  format:
                    type: number
                    suffix: " /min"
                    options:
                      maximumFractionDigits: 1
                - label: Success
                  query: '1 - ((sum(increase(response_total{namespace="productivity",deployment="vaultwarden",direction="inbound",target_port="80",classification="failure"}[1h])) or vector(0)) / clamp_min((sum(increase(response_total{namespace="productivity",deployment="vaultwarden",direction="inbound",target_port="80"}[1h])) or vector(0)), 1))'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 1
                - label: p95
                  query: 'histogram_quantile(0.95, sum by (le) (rate(response_latency_ms_bucket{namespace="productivity",deployment="vaultwarden",direction="inbound",target_port="80"}[5m])))'
                  format:
                    type: number
                    suffix: " ms"
                    options:
                      maximumFractionDigits: 0
                - label: Storage
                  query: '1 - max(kubelet_volume_stats_available_bytes{namespace="productivity",persistentvolumeclaim="vaultwarden-data-critical"}) / max(kubelet_volume_stats_capacity_bytes{namespace="productivity",persistentvolumeclaim="vaultwarden-data-critical"})'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
        - UniFi:
            icon: unifi.png
            href: https://unifi.rcrumana.xyz
            description: Network controller
            namespace: productivity
            app: unifi-os-server
            widget:
              type: unifi
              url: https://unifi.rcrumana.xyz
              key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
              site: "{{HOMEPAGE_VAR_UNIFI_SITE}}"
              fields: ["uptime", "wlan", "wlan_devices"]
              hideErrors: true
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: https://uptime.rcrumana.xyz
            description: Service uptime checks
            namespace: productivity
            app: uptime-kuma
            widget:
              type: uptimekuma
              url: http://uptime-kuma.productivity.svc.cluster.local
              slug: "{{HOMEPAGE_VAR_UPTIME_KUMA_SLUG}}"
              fields: ["up", "down", "uptime", "incident"]
              hideErrors: true
        - Hypermind:
            icon: mdi-brain
            href: https://hypermind.rcrumana.xyz
            description: Shared map and chat
            namespace: other
            app: hypermind
            widget:
              type: customapi
              url: http://hypermind.other.svc.cluster.local/api/stats
              refreshInterval: 30000
              mappings:
                - field: peers
                  label: Peers
                  format: size
                - field: totalUnique
                  label: Known
                  format: number
                - field: diagnostics.heartbeatsReceived
                  label: Received
                  format: number
                - field: diagnostics.heartbeatsRelayed
                  label: Relayed
                  format: number
              hideErrors: true

    - Infrastructure:
        - Ceph:
            icon: ceph.png
            href: https://ceph.rcrumana.xyz
            description: Primary cluster storage
            namespace: rook-ceph
            app: ceph-mgr
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 15000
              highlight:
                Health:
                  numeric:
                    - level: danger
                      when: lt
                      value: 100
                    - level: good
                      when: eq
                      value: 100
                OSDs:
                  numeric:
                    - level: danger
                      when: lt
                      value: 100
                    - level: good
                      when: eq
                      value: 100
                PGs:
                  numeric:
                    - level: danger
                      when: lt
                      value: 100
                    - level: good
                      when: eq
                      value: 100
                Used:
                  numeric:
                    - level: danger
                      when: gte
                      value: 90
                    - level: warn
                      when: gte
                      value: 75
              metrics:
                - label: Health
                  query: '1 - clamp_max(ceph_health_status, 1)'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
                - label: OSDs
                  query: 'sum(ceph_osd_up) / count(ceph_osd_metadata)'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
                - label: PGs
                  query: 'sum(ceph_pg_clean) / sum(ceph_pg_total)'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
                - label: Used
                  query: 'ceph_cluster_total_used_bytes / ceph_cluster_total_bytes'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
        - OPNsense:
            icon: opnsense.png
            href: https://router.rcrumana.xyz
            siteMonitor: https://router.rcrumana.xyz
            description: Router and firewall
            widget:
              type: opnsense
              url: https://router.rcrumana.xyz
              username: "{{HOMEPAGE_VAR_OPNSENSE_KEY}}"
              password: "{{HOMEPAGE_VAR_OPNSENSE_SECRET}}"
              wan: "{{HOMEPAGE_VAR_OPNSENSE_WAN}}"
              fields: ["cpu", "wanUpload", "wanDownload"]
              hideErrors: true
        - Argo CD:
            icon: argo-cd.png
            href: https://argocd.rcrumana.xyz
            description: GitOps control plane
            namespace: argocd
            app: argocd-server
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
              fields: ["apps", "synced", "healthy"]
              hideErrors: true
        - Authentik:
            icon: authentik.png
            href: https://auth.rcrumana.xyz/if/admin/
            description: Identity and access management
            namespace: identity
            podSelector: app.kubernetes.io/component=server
        - Gitea:
            icon: gitea.png
            href: https://git.rcrumana.xyz
            description: Source control and automation
            namespace: development
            app: gitea
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 15000
              highlight:
                Storage:
                  numeric:
                    - level: danger
                      when: gte
                      value: 90
                    - level: warn
                      when: gte
                      value: 75
              metrics:
                - label: Repositories
                  query: 'max(gitea_repositories{namespace="development",service="gitea-http"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Users
                  query: 'max(gitea_users{namespace="development",service="gitea-http",state="active"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Open Issues
                  query: 'max(gitea_issues_open{namespace="development",service="gitea-http"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Storage
                  query: '1 - max(kubelet_volume_stats_available_bytes{namespace="development",persistentvolumeclaim="gitea-shared-storage"}) / max(kubelet_volume_stats_capacity_bytes{namespace="development",persistentvolumeclaim="gitea-shared-storage"})'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
        - Qdrant:
            icon: qdrant.png
            href: https://grafana.rcrumana.xyz/d/qdrant-cluster/qdrant-cluster
            description: Distributed vector database
            namespace: databases
            app: qdrant
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 15000
              highlight:
                Healthy Peers:
                  numeric:
                    - level: danger
                      when: lt
                      value: 2
                    - level: warn
                      when: lt
                      value: 3
                    - level: good
                      when: eq
                      value: 3
                Dead Replicas:
                  numeric:
                    - level: danger
                      when: gt
                      value: 0
                    - level: good
                      when: eq
                      value: 0
              metrics:
                - label: Healthy Peers
                  query: 'sum(up{namespace="databases",service="qdrant-headless"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Collections
                  query: 'max(collections_total{namespace="databases",service="qdrant-headless"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Vectors
                  query: 'max(collections_vector_total{namespace="databases",service="qdrant-headless"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Dead Replicas
                  query: 'max(collection_dead_replicas{namespace="databases",service="qdrant-headless"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
        - Headscale:
            icon: headscale.png
            href: https://headscale.rcrumana.xyz/web
            description: Tailnet admin UI
            namespace: other
            app: headscale
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 15000
              highlight:
                Queue:
                  numeric:
                    - level: danger
                      when: gte
                      value: 10
                    - level: warn
                      when: gte
                      value: 1
                    - level: good
                      when: eq
                      value: 0
              metrics:
                - label: Nodes
                  query: 'max(headscale_nodestore_nodes{namespace="other",service="headscale"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Updates
                  query: 'sum(rate(headscale_mapresponse_endpoint_updates_total{namespace="other",service="headscale"}[5m])) * 60'
                  format:
                    type: number
                    suffix: " /min"
                    options:
                      maximumFractionDigits: 1
                - label: Queue
                  query: 'max(headscale_nodestore_queue_depth{namespace="other",service="headscale"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Ops p95
                  query: 'histogram_quantile(0.95, sum by (le) (rate(headscale_nodestore_operation_duration_seconds_bucket{namespace="other",service="headscale"}[5m])))'
                  format:
                    type: number
                    suffix: " s"
                    options:
                      maximumFractionDigits: 3
        - Grafana:
            icon: grafana.png
            href: https://grafana.rcrumana.xyz
            description: Metrics and log dashboards
            namespace: monitoring
            podSelector: app.kubernetes.io/name=grafana
            widget:
              type: grafana
              version: 2
              alerts: grafana
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
              username: "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
              fields: ["dashboards", "datasources", "totalalerts", "alertstriggered"]
              hideErrors: true
        - Harbor:
            icon: harbor.png
            href: https://harbor.rcrumana.xyz
            description: Container registry
            namespace: harbor
            podSelector: app=harbor
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 15000
              highlight:
                Health:
                  numeric:
                    - level: danger
                      when: lt
                      value: 100
                    - level: good
                      when: eq
                      value: 100
              metrics:
                - label: Health
                  query: 'sum(harbor_up{namespace="harbor"}) / count(harbor_up{namespace="harbor"})'
                  format:
                    type: percent
                    scale: 100
                    options:
                      maximumFractionDigits: 0
                - label: Repositories
                  query: 'sum(harbor_project_repo_total{namespace="harbor"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Artifacts
                  query: 'sum(harbor_project_artifact_total{namespace="harbor"})'
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: Storage
                  query: 'max(harbor_statistics_total_storage_consumption{namespace="harbor"})'
                  format:
                    type: bytes
    - Nodes:
        - melchior-1:
            icon: mdi-server
            href: https://grafana.rcrumana.xyz/d/fac67cfbe174d3ef53eb473d73d9212f/node-exporter-use-method-node?orgId=1&var-datasource=prometheus&var-cluster=&var-instance=192.168.1.13%3A9100
            siteMonitor: http://192.168.1.13:9100/metrics
            description: Control plane
            widgets:
              - type: prometheusmetric
                url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                refreshInterval: 15000
                highlight: &node_health_highlights
                  CPU:
                    numeric:
                      - level: danger
                        when: gte
                        value: 95
                      - level: warn
                        when: gte
                        value: 80
                  RAM:
                    numeric:
                      - level: danger
                        when: gte
                        value: 95
                      - level: warn
                        when: gte
                        value: 85
                  Temp:
                    numeric:
                      - level: danger
                        when: gte
                        value: 90
                      - level: warn
                        when: gte
                        value: 80
                metrics:
                  - label: CPU
                    query: 'rate(node_cpu_usage_seconds_total{node="melchior-1"}[2m]) / on(node) kube_node_status_capacity{node="melchior-1",resource="cpu",unit="core"}'
                    format:
                      type: percent
                      scale: 100
                      options:
                        maximumFractionDigits: 0
                  - label: RAM
                    query: 'node_memory_working_set_bytes{node="melchior-1"} / on(node) kube_node_status_capacity{node="melchior-1",resource="memory",unit="byte"}'
                    format:
                      type: percent
                      scale: 100
                      options:
                        maximumFractionDigits: 0
                  - label: Temp
                    query: 'max(node_hwmon_temp_celsius{instance="192.168.1.13:9100",chip=~"pci.*18_3"})'
                    format:
                      type: number
                      suffix: " °C"
                      options:
                        maximumFractionDigits: 0
                  - label: Up
                    query: 'rate(node_network_transmit_bytes_total{instance="192.168.1.13:9100",device="enp195s0"}[5m])'
                    format:
                      type: bibyterate
                      options:
                        maximumFractionDigits: 1
        - balthasar-2:
            icon: mdi-server
            href: https://grafana.rcrumana.xyz/d/fac67cfbe174d3ef53eb473d73d9212f/node-exporter-use-method-node?orgId=1&var-datasource=prometheus&var-cluster=&var-instance=192.168.1.14%3A9100
            siteMonitor: http://192.168.1.14:9100/metrics
            description: Control plane
            widgets:
              - type: prometheusmetric
                url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                refreshInterval: 15000
                highlight: *node_health_highlights
                metrics:
                  - label: CPU
                    query: 'rate(node_cpu_usage_seconds_total{node="balthasar-2"}[2m]) / on(node) kube_node_status_capacity{node="balthasar-2",resource="cpu",unit="core"}'
                    format:
                      type: percent
                      scale: 100
                      options:
                        maximumFractionDigits: 0
                  - label: RAM
                    query: 'node_memory_working_set_bytes{node="balthasar-2"} / on(node) kube_node_status_capacity{node="balthasar-2",resource="memory",unit="byte"}'
                    format:
                      type: percent
                      scale: 100
                      options:
                        maximumFractionDigits: 0
                  - label: Temp
                    query: 'max(node_hwmon_temp_celsius{instance="192.168.1.14:9100",chip=~"pci.*18_3"})'
                    format:
                      type: number
                      suffix: " °C"
                      options:
                        maximumFractionDigits: 0
                  - label: Up
                    query: 'rate(node_network_transmit_bytes_total{instance="192.168.1.14:9100",device="enp196s0"}[5m])'
                    format:
                      type: bibyterate
                      options:
                        maximumFractionDigits: 1
        - casper-3:
            icon: mdi-server
            href: https://grafana.rcrumana.xyz/d/fac67cfbe174d3ef53eb473d73d9212f/node-exporter-use-method-node?orgId=1&var-datasource=prometheus&var-cluster=&var-instance=192.168.1.15%3A9100
            siteMonitor: http://192.168.1.15:9100/metrics
            description: Control plane
            widgets:
              - type: prometheusmetric
                url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                refreshInterval: 15000
                highlight: *node_health_highlights
                metrics:
                  - label: CPU
