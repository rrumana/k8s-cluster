# Staged resource. Add it to kustomization.yaml only when the Vault values
# described in docs/identity-access-runbook.md exist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-identity
  namespace: productivity
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: nextcloud-identity
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: apps/productivity/nextcloud-identity
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: apps/productivity/nextcloud-identity
        property: client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-mail
  namespace: productivity
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: nextcloud-mail
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: apps/productivity/nextcloud-mail
        property: host
    - secretKey: username
      remoteRef:
        key: apps/productivity/nextcloud-mail
        property: username
    - secretKey: password
      remoteRef:
        key: apps/productivity/nextcloud-mail
        property: password
