# Supplemental values for Authentik-backed Nextcloud authentication.
# Normal login redirects to Authentik. The local administrator remains
# available for break-glass recovery through /login?direct=1.

# The hook ConfigMap is emitted at Argo CD's default wave. Start the
# Deployment afterward so its required hook volume exists before scheduling.
deploymentAnnotations:
  argocd.argoproj.io/sync-wave: "10"

image:
  registry: harbor.rcrumana.xyz
  repository: apps-private/nextcloud
  tag: "33.0.0-user_oidc-8.10.1@sha256:ff71a5b9d74d8d9db95e5679de069b7b0d7a46ab502789320c914648adab65f4"

nextcloud:
  extraEnv:
    - name: NEXTCLOUD_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: nextcloud-identity
          key: client-id
    - name: NEXTCLOUD_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: nextcloud-identity
          key: client-secret
    - name: MAIL_FROM_ADDRESS
      value: nextcloud
    - name: MAIL_DOMAIN
      value: mail.rcrumana.xyz
    - name: SMTP_HOST
      valueFrom:
        secretKeyRef:
          name: nextcloud-mail
          key: host
    - name: SMTP_PORT
      value: "587"
    - name: SMTP_SECURE
      value: tls
    - name: SMTP_AUTHTYPE
      value: LOGIN
    - name: SMTP_NAME
      valueFrom:
        secretKeyRef:
          name: nextcloud-mail
          key: username
    - name: SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nextcloud-mail
          key: password

  hooks:
    before-starting: |-
      #!/bin/sh
      set -eu

      php /var/www/html/occ app:enable user_oidc
      php /var/www/html/occ user_oidc:provider authentik \
        --clientid="${NEXTCLOUD_OIDC_CLIENT_ID}" \
        --clientsecret-env=NEXTCLOUD_OIDC_CLIENT_SECRET \
        --discoveryuri="https://auth.rcrumana.xyz/application/o/nextcloud/.well-known/openid-configuration" \
        --postlogouturi="https://nextcloud.rcrumana.xyz/login" \
        --scope="openid email profile groups nextcloud" \
        --unique-uid=1 \
        --mapping-uid=nextcloud_uid \
        --mapping-email=email \
        --mapping-display-name=name \
        --mapping-groups=groups \
        --group-provisioning=1 \
        --group-whitelist-regex='/^app-nextcloud$/' \
        --group-restrict-login-to-whitelist=1
      php /var/www/html/occ config:app:set user_oidc \
        allow_multiple_user_backends --type=string --value=0

      # Keep public sharing broadly available without weakening authentication
      # or user-directory privacy. Passwords and expirations remain available
      # to share owners but are not mandatory defaults.
      php /var/www/html/occ config:app:set core \
        shareapi_enabled --type=string --value=yes
      php /var/www/html/occ config:app:set core \
        shareapi_allow_links --type=string --value=yes
      php /var/www/html/occ config:app:set core \
        shareapi_allow_public_upload --type=string --value=yes
      php /var/www/html/occ config:app:set core \
        shareapi_allow_resharing --type=string --value=yes
      php /var/www/html/occ config:app:set core \
        shareapi_allow_federation_on_public_shares --type=boolean --value=true
      php /var/www/html/occ config:app:set core \
        shareapi_allow_custom_tokens --type=boolean --value=true
      php /var/www/html/occ config:app:set core \
        shareapi_allow_view_without_download --type=boolean --value=true
      php /var/www/html/occ config:app:set core \
        shareapi_enable_link_password_by_default --type=boolean --value=false
      php /var/www/html/occ config:app:set core \
        shareapi_enforce_links_password --type=boolean --value=false
      php /var/www/html/occ config:app:set core \
        shareapi_default_expire_date --type=boolean --value=false
      php /var/www/html/occ config:app:set core \
        shareapi_enforce_expire_date --type=boolean --value=false
