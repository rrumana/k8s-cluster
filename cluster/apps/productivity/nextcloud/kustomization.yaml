apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: productivity

resources:
  - linkerd-policy.yaml
  - networkpolicy.yaml
  - externalsecret.yaml
  - identity-externalsecret.yaml
  - pvc.yaml
  - serviceaccount.yaml
  - vpa.yaml

labels:
  - pairs:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/managed-by: argocd
    includeSelectors: true
