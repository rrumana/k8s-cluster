apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: vaultwarden
    spec:
      serviceAccountName: vaultwarden
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vaultwarden
        image: harbor.rcrumana.xyz/proxy-dockerhub/vaultwarden/server:1.37.1
        ports:
        - containerPort: 80
          name: http
        env:
        - name: DOMAIN
          value: "https://vault.rcrumana.xyz"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vaultwarden-db-shared
              key: DATABASE_URL
        - name: SIGNUPS_ALLOWED
          value: "false"
        - name: SSO_ENABLED
          value: "true"
        # Keep the native email + master-password route during the client
        # pilot. SSO_ONLY can be considered only after every client passes.
        - name: SSO_ONLY
          value: "false"
        - name: SSO_SIGNUPS_MATCH_EMAIL
          value: "true"
        - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
          value: "false"
        - name: SSO_AUTHORITY
          value: "https://auth.rcrumana.xyz/application/o/vaultwarden/"
        - name: SSO_CLIENT_ID
          value: "vaultwarden"
        - name: SSO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: vaultwarden-identity
              key: SSO_CLIENT_SECRET
        - name: SSO_SCOPES
          value: "openid profile email offline_access"
        - name: SSO_PKCE
          value: "true"
        - name: SSO_CLIENT_CACHE_EXPIRATION
          value: "600"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vaultwarden-data-critical
