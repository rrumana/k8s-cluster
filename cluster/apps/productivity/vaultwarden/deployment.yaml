apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: vaultwarden
    spec:
      serviceAccountName: vaultwarden
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vaultwarden
        image: harbor.rcrumana.xyz/proxy-dockerhub/vaultwarden/server:1.37.1
        ports:
        - containerPort: 80
          name: http
        env:
        - name: DOMAIN
          value: "https://vault.rcrumana.xyz"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vaultwarden-db-shared
              key: DATABASE_URL
        - name: SIGNUPS_ALLOWED
          value: "false"
        - name: SIGNUPS_VERIFY
          value: "true"
        - name: INVITATIONS_ALLOWED
          # Site administrators can still invite standalone accounts. Disable
          # organization-admin invitations so client accounts cannot onboard
          # additional users independently.
          value: "false"
        - name: INVITATION_EXPIRATION_HOURS
          value: "72"
        - name: INVITATION_ORG_NAME
          value: "Rcrumana Vault"
        - name: ORG_CREATION_USERS
          value: "none"
        - name: SHOW_PASSWORD_HINT
          value: "false"
        - name: SSO_ENABLED
          value: "false"
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: vaultwarden-access
              key: ADMIN_TOKEN
        - name: SMTP_HOST
          value: "smtp.mailgun.org"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_SECURITY
          value: "starttls"
        - name: SMTP_FROM
          value: "vaultwarden@mail.rcrumana.xyz"
        - name: SMTP_FROM_NAME
          value: "Rcrumana Vault"
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: vaultwarden-access
              key: SMTP_USERNAME
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-access
              key: SMTP_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vaultwarden-data-critical
