  bookmarks.yaml: ""
  widgets.yaml: ""
  docker.yaml: ""
  custom.css: |
    /* Translucent cards keep the background visible without sacrificing contrast. */
    .service-card {
      background-color: rgba(15, 23, 42, 0.56) !important;
      border: 1px solid rgba(148, 163, 184, 0.18) !important;
      box-shadow: 0 12px 30px rgba(2, 6, 23, 0.24) !important;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .service-card:hover {
      background-color: rgba(15, 23, 42, 0.68) !important;
      border-color: rgba(56, 189, 248, 0.34) !important;
      transform: translateY(-1px);
    }

    #information-widgets {
      border-color: rgba(148, 163, 184, 0.24) !important;
    }

    /* Calendar integrations require service widgets, but clients do not need ARR cards. */
    .service[data-name="Calendar Sonarr"],
    .service[data-name="Calendar Radarr"],
    .service[data-name="Calendar Lidarr"] {
      display: none !important;
    }

    /* Theme and color are fixed, so the remaining footer controls are unnecessary. */
    #footer {
      display: none !important;
    }

    /* Keep short nested columns aligned with the calendar column. */
    @media (min-width: 768px) {
      #layout-groups .services-group.subgroup > div,
      #layout-groups .services-group.subgroup > div > .services-list {
        height: 100%;
      }
    }
  custom.js: ""
