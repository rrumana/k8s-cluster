apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiteboard
spec:
  replicas: 1
  selector:
    matchLabels: { app: whiteboard }
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels: { app: whiteboard }
    spec:
      serviceAccountName: whiteboard
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whiteboard
          image: harbor.rcrumana.xyz/proxy-ghcr/nextcloud-releases/whiteboard:stable@sha256:ba9fb41ab8a79284b4bfab92f6169a376d2c8e1d32f3d4434d14b8f299102a97
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3002"
            - name: TLS
              value: "false"
            - name: NEXTCLOUD_URL
              value: "https://nextcloud.rcrumana.xyz"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: whiteboard-jwt
                  key: jwt-secret
          ports:
            - name: http
              containerPort: 3002
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "2", memory: 2Gi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
