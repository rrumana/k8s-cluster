apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-staging
  labels:
    app: portfolio-staging
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: portfolio-staging
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: portfolio-staging
    spec:
      serviceAccountName: portfolio-staging
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: portfolio-staging
              topologyKey: kubernetes.io/hostname
      containers:
        - name: portfolio
          image: harbor.rcrumana.xyz/apps-private/portfolio@sha256:ed8ce6ccc5bf770d61148a7d35d3fd1e6c54993d73f6da0073d2a925382816da
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RUST_LOG
              value: "info"
          ports:
            - name: http
              containerPort: 8085
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
