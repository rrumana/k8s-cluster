# Staged resource. Add it to kustomization.yaml when Headscale OIDC is enabled.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-oidc
  namespace: other
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: headscale-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: apps/other/headscale-identity
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: apps/other/headscale-identity
        property: client-secret
