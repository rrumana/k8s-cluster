apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
data:
  00-rcrumana-foundation.yaml: |
    # yaml-language-server: $schema=https://version-2026-5.goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Rcrumana - Identity foundation
      labels:
        blueprints.goauthentik.io/description: >-
          Stable brand and authorization groups for GitOps-managed application
          access. Authentication and enrollment flows are managed separately.
    entries:
      - model: authentik_brands.brand
        identifiers:
          domain: auth.rcrumana.xyz
        attrs:
          default: false
          branding_title: Rcrumana Identity

      - model: authentik_core.group
        identifiers:
          name: app-immich
        attrs:
          is_superuser: false

      - model: authentik_core.group
        identifiers:
          name: app-nextcloud
        attrs:
          is_superuser: false

      - model: authentik_core.group
        identifiers:
          name: headscale-users
        attrs:
          is_superuser: false

      - model: authentik_core.group
        identifiers:
          name: platform-admins
        attrs:
          is_superuser: true
  10-rcrumana-identity.yaml: |
    # yaml-language-server: $schema=https://version-2026-5.goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Rcrumana - Invitation, passkey, recovery, and pilot applications
    entries:
      # Ensure mounted and packaged dependencies have been applied before
      # resolving their groups, stages, and flows below.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Rcrumana - Identity foundation
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - WebAuthn MFA setup flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Static MFA setup flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - TOTP MFA setup flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider invalidation flow
          required: true

      # Invitation-only enrollment. Per-invitation fixed_data must contain an
      # email and one or more names in app_groups.
      - model: authentik_flows.flow
        id: invitation-enrollment-flow
        identifiers:
          slug: rcrumana-invitation-enrollment
        attrs:
          name: Rcrumana invitation enrollment
          title: Complete your invitation
          designation: enrollment
          authentication: require_unauthenticated

      - model: authentik_stages_invitation.invitationstage
        id: invitation-stage
        identifiers:
          name: rcrumana-invitation-required
        attrs:
          continue_flow_without_invitation: false

      - model: authentik_stages_prompt.prompt
        id: enrollment-username
        identifiers:
          name: rcrumana-enrollment-username
        attrs:
          field_key: username
          label: Username
          type: username
          required: true
          order: 10

      - model: authentik_stages_prompt.prompt
        id: enrollment-name
        identifiers:
          name: rcrumana-enrollment-name
        attrs:
          field_key: name
          label: Display name
          type: text
          required: true
          order: 20

      - model: authentik_stages_prompt.prompt
        id: enrollment-email
        identifiers:
          name: rcrumana-enrollment-email
        attrs:
          field_key: email
          label: Invited email
          type: text_read_only
          required: true
          order: 30

      - model: authentik_stages_prompt.prompt
        id: enrollment-password
        identifiers:
          name: rcrumana-enrollment-password
        attrs:
          field_key: password
          label: Fallback password
          type: password
          required: true
          order: 40

      - model: authentik_stages_prompt.prompt
        id: enrollment-password-repeat
        identifiers:
          name: rcrumana-enrollment-password-repeat
        attrs:
          field_key: password_repeat
          label: Fallback password (repeat)
          type: password
          required: true
          order: 50

      - model: authentik_policies_password.passwordpolicy
        id: account-password-policy
        identifiers:
          name: default-password-change-password-policy
        attrs:
          password_field: password
          length_min: 12
          check_static_rules: true
          check_zxcvbn: true
          zxcvbn_score_threshold: 2
          error_message: Use at least 12 characters and avoid common or predictable passwords.

      - model: authentik_stages_prompt.promptstage
        id: enrollment-prompt
        identifiers:
          name: rcrumana-enrollment-details
        attrs:
          fields:
            - !KeyOf enrollment-username
            - !KeyOf enrollment-name
            - !KeyOf enrollment-email
            - !KeyOf enrollment-password
            - !KeyOf enrollment-password-repeat
          validation_policies:
            - !KeyOf account-password-policy

      - model: authentik_policies_expression.expressionpolicy
        id: invitation-policy
        identifiers:
          name: rcrumana-invitation-fixed-email-and-groups
        attrs:
          expression: |
            from authentik.core.models import Group, User

            invitation = request.context.get("invitation")
            prompt = request.context.get("prompt_data", {})
            if invitation is None:
                return False

            invited_email = str(invitation.fixed_data.get("email", "")).strip().lower()
            submitted_email = str(prompt.get("email", "")).strip().lower()
            if not invited_email or submitted_email != invited_email:
                return False
            if User.objects.filter(email__iexact=invited_email).exists():
                return False

            requested = invitation.fixed_data.get("app_groups", [])
            allowed = {
                "app-immich",
                "app-nextcloud",
                "headscale-users",
                "platform-admins",
            }
            if not isinstance(requested, list) or not requested:
                return False
            requested = list(dict.fromkeys(requested))
            if any(group not in allowed for group in requested):
                return False

            groups = list(Group.objects.filter(name__in=requested))
            if len(groups) != len(requested):
                return False

            flow_plan = request.context.get("flow_plan")
            if flow_plan is None:
                return False
            flow_plan.context["groups"] = groups
            return True

      - model: authentik_stages_user_write.userwritestage
        id: enrollment-user-write
        identifiers:
          name: rcrumana-enrollment-user-write
        attrs:
          create_users_as_inactive: true
          user_creation_mode: always_create
          # Human users need the Authentik user interface to manage passkeys,
          # sessions, and recovery credentials. Group membership, not user
          # type, controls administrative access.
          user_type: internal
          user_path_template: users/invited

      - model: authentik_stages_email.emailstage
        id: enrollment-email-verification
        identifiers:
          name: rcrumana-enrollment-email-verification
        attrs:
          use_global_settings: true
          token_expiry: hours=1
          subject: Verify your Rcrumana account
          template: email/account_confirmation.html
          activate_user_on_success: true

      - model: authentik_stages_user_login.userloginstage
        id: enrollment-login
        identifiers:
          name: rcrumana-enrollment-login
        attrs:
          session_duration: hours=12
          remember_me_offset: days=29;hours=12
          remember_device: days=30

      - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
        id: enrollment-webauthn
        identifiers:
          name: rcrumana-enrollment-platform-passkey
        attrs:
          friendly_name: Platform passkey
          user_verification: required
          resident_key_requirement: required
          authenticator_attachment: null
          prevent_duplicate_devices: true
          hints: []
          max_attempts: 5

      - model: authentik_stages_authenticator_email.authenticatoremailstage
        id: enrollment-email-authenticator
        identifiers:
          name: rcrumana-enrollment-email-otp
        attrs:
          # Retain a confirmed EmailDevice as the durable email-verification
          # signal used by the OIDC claims mapping. Email is allowed only as a
          # password-login fallback and is not accepted by recovery MFA.
          friendly_name: Verified email (recovery only)
          use_global_settings: true
          token_expiry: minutes=10
          subject: Verify your Rcrumana email address

      - model: authentik_stages_authenticator_totp.authenticatortotpstage
        id: enrollment-totp
        identifiers:
          name: rcrumana-enrollment-totp
        attrs:
          friendly_name: Authenticator app (TOTP)
          digits: "6"

      - model: authentik_stages_authenticator_static.authenticatorstaticstage
        id: enrollment-recovery-codes
        identifiers:
          name: rcrumana-enrollment-recovery-codes
        attrs:
          friendly_name: Recovery codes
          token_count: 10
          token_length: 12

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf invitation-stage
          order: 5
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf enrollment-prompt
          order: 10
      - model: authentik_flows.flowstagebinding
        id: enrollment-user-write-binding
        identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf enrollment-user-write
          order: 20
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf enrollment-user-write-binding
          policy: !KeyOf invitation-policy
          order: 0
        attrs:
          failure_result: false
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf enrollment-email-verification
          order: 30
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf enrollment-login
          order: 100
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf enrollment-webauthn
          order: 50
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf enrollment-email-authenticator
          order: 60
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf enrollment-totp
          order: 65
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf enrollment-recovery-codes
          order: 70

      # The recovery flow must precede the default identification stage that
      # references it with !KeyOf.
      - model: authentik_flows.flow
        id: recovery-flow
        identifiers:
          slug: rcrumana-recovery
        attrs:
          name: Rcrumana account recovery
          title: Recover your account
          designation: recovery
          authentication: require_unauthenticated

      # Passkey-first normal authentication and password+MFA fallback.
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: default-authentication-mfa-validation
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          not_configured_action: deny
          device_classes:
            - webauthn
            - totp
            - email
            - static
          webauthn_user_verification: required
          webauthn_hints: []

      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields:
            - email
            - username
          webauthn_stage: !KeyOf default-authentication-mfa-validation
          # Remembering the identifier can jump directly to the password stage
          # and bypass conditional passkey discovery on the identification
          # screen. Keep every fresh login passkey-first instead.
          enable_remember_me: false
          recovery_flow: !KeyOf recovery-flow

      - model: authentik_stages_user_login.userloginstage
        identifiers:
          name: default-authentication-login
        attrs:
          session_duration: hours=12
          remember_me_offset: days=29;hours=12
          remember_device: days=30

      - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
        identifiers:
          name: default-authenticator-webauthn-setup
        attrs:
          friendly_name: Additional passkey
          user_verification: required
          resident_key_requirement: required
          prevent_duplicate_devices: true
          max_attempts: 5

      - model: authentik_stages_authenticator_static.authenticatorstaticstage
        identifiers:
          name: default-authenticator-static-setup
        attrs:
          friendly_name: Recovery codes
          token_count: 10
          token_length: 12

      - model: authentik_stages_authenticator_totp.authenticatortotpstage
        identifiers:
          name: default-authenticator-totp-setup
        attrs:
          friendly_name: Authenticator app (TOTP)
          digits: "6"

      # Password recovery requires both an email link and an existing MFA
      # device before changing the password.
      - model: authentik_stages_identification.identificationstage
        id: recovery-identification
        identifiers:
          name: rcrumana-recovery-identification
        attrs:
          user_fields:
            - email
            - username

      - model: authentik_stages_email.emailstage
        id: recovery-email
        identifiers:
          name: rcrumana-recovery-email
        attrs:
          use_global_settings: true
          token_expiry: minutes=30
          subject: Rcrumana account recovery
          template: email/password_reset.html
          recovery_max_attempts: 5
          recovery_cache_timeout: minutes=15

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: recovery-mfa
        identifiers:
          name: rcrumana-recovery-mfa
        attrs:
          not_configured_action: deny
          device_classes:
            - webauthn
            - totp
            - static
          webauthn_user_verification: required

      - model: authentik_stages_prompt.prompt
        id: recovery-password
        identifiers:
          name: rcrumana-recovery-password
        attrs:
          field_key: password
          label: New password
          type: password
          required: true
          order: 10
      - model: authentik_stages_prompt.prompt
        id: recovery-password-repeat
        identifiers:
          name: rcrumana-recovery-password-repeat
        attrs:
          field_key: password_repeat
          label: New password (repeat)
          type: password
          required: true
          order: 20
      - model: authentik_stages_prompt.promptstage
        id: recovery-password-prompt
        identifiers:
          name: rcrumana-recovery-password-prompt
        attrs:
          fields:
            - !KeyOf recovery-password
            - !KeyOf recovery-password-repeat
          validation_policies:
            - !KeyOf account-password-policy
      - model: authentik_stages_user_write.userwritestage
        id: recovery-user-write
        identifiers:
          name: rcrumana-recovery-user-write
        attrs:
          user_creation_mode: never_create
      - model: authentik_stages_user_login.userloginstage
        id: recovery-login
        identifiers:
          name: rcrumana-recovery-login
        attrs:
          session_duration: hours=12
          remember_me_offset: days=29;hours=12
          remember_device: days=30

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery-flow
          stage: !KeyOf recovery-identification
          order: 10
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery-flow
          stage: !KeyOf recovery-email
          order: 20
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery-flow
          stage: !KeyOf recovery-mfa
          order: 30
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery-flow
          stage: !KeyOf recovery-password-prompt
          order: 40
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery-flow
          stage: !KeyOf recovery-user-write
          order: 50
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery-flow
          stage: !KeyOf recovery-login
          order: 100

      - model: authentik_brands.brand
        identifiers:
          domain: auth.rcrumana.xyz
        attrs:
          flow_recovery: !KeyOf recovery-flow

      # Verified-email and Immich role claims.
      - model: authentik_providers_oauth2.scopemapping
        id: verified-email-scope
        identifiers:
          name: Rcrumana verified email
        attrs:
          scope_name: email
          description: Verified invitation email
          expression: |
            from authentik.stages.authenticator_email.models import EmailDevice

            verified = EmailDevice.objects.filter(
                user=request.user,
                email__iexact=request.user.email,
                confirmed=True,
            ).exists()
            return {
                "email": request.user.email,
                "email_verified": verified,
            }

      - model: authentik_providers_oauth2.scopemapping
        id: immich-scope
        identifiers:
          name: Rcrumana Immich claims
        attrs:
          scope_name: immich
          description: Immich role and quota
          expression: |
            is_admin = request.user.groups.filter(name="platform-admins").exists()
            return {
                "immich_role": "admin" if is_admin else "user",
                "immich_quota": 0,
            }

      - model: authentik_providers_oauth2.scopemapping
        id: groups-scope
        identifiers:
          name: Rcrumana groups
        attrs:
          scope_name: groups
          description: Authentik group memberships
          expression: |
            return {
                "groups": [group.name for group in request.user.groups.all()],
            }

      - model: authentik_providers_oauth2.scopemapping
        id: nextcloud-uid-scope
        identifiers:
          name: Rcrumana Nextcloud UID
        attrs:
          scope_name: nextcloud
          description: Stable Nextcloud UID with explicit legacy account links
          expression: |
            legacy_uids = {
                "b1ff6934-ecb9-4235-9260-cdaaf13e90a0": "Ryan_and_Kaylee",
                "c582b58e-fc7d-446e-9a18-7c75d97c8801": "admin",
            }
            authentik_uuid = str(request.user.uuid)
            return {
                "nextcloud_uid": legacy_uids.get(authentik_uuid, authentik_uuid),
            }

      - model: authentik_providers_oauth2.oauth2provider
        id: immich-provider
        identifiers:
          name: Immich
        attrs:
          authorization_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-authorization-implicit-consent]
          invalidation_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-invalidation-flow]
          client_type: confidential
          client_id: immich
          client_secret: !Env AUTHENTIK_OIDC_IMMICH_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: app.immich:///oauth-callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://immich.rcrumana.xyz/auth/login
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://immich.rcrumana.xyz/user-settings
              redirect_uri_type: authorization
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          refresh_token_threshold: seconds=0
          include_claims_in_id_token: true
          sub_mode: user_uuid
          issuer_mode: per_provider
          logout_method: backchannel
          logout_uri: https://immich.rcrumana.xyz/api/oauth/backchannel-logout
          property_mappings:
            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-openid]
            - !KeyOf verified-email-scope
            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-profile]
            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-offline_access]
            - !KeyOf immich-scope
          signing_key: !Find
            - authentik_crypto.certificatekeypair
            - [name, authentik Self-signed Certificate]

      - model: authentik_core.application
        id: immich-application
        identifiers:
          slug: immich
        attrs:
          name: Immich
          provider: !KeyOf immich-provider
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf immich-application
          group: !Find [authentik_core.group, [name, app-immich]]
          order: 0

      - model: authentik_providers_oauth2.oauth2provider
        id: nextcloud-provider
        identifiers:
          name: Nextcloud
        attrs:
          authorization_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-authorization-implicit-consent]
          invalidation_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-invalidation-flow]
          client_type: confidential
          client_id: nextcloud
          client_secret: !Env AUTHENTIK_OIDC_NEXTCLOUD_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://nextcloud.rcrumana.xyz/apps/user_oidc/code
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://nextcloud.rcrumana.xyz/login
              redirect_uri_type: logout
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          refresh_token_threshold: seconds=0
          include_claims_in_id_token: true
          sub_mode: user_uuid
          issuer_mode: per_provider
          property_mappings:
            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-openid]
            - !KeyOf verified-email-scope
            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-profile]
            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-offline_access]
            - !KeyOf groups-scope
            - !KeyOf nextcloud-uid-scope
          signing_key: !Find
            - authentik_crypto.certificatekeypair
            - [name, authentik Self-signed Certificate]

      - model: authentik_core.application
        id: nextcloud-application
        identifiers:
          slug: nextcloud
        attrs:
          name: Nextcloud
          provider: !KeyOf nextcloud-provider
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf nextcloud-application
          group: !Find [authentik_core.group, [name, app-nextcloud]]
          order: 0

      # Headscale remains on its current local-account configuration until the
      # pilot applications are stable. Defining its provider now makes the
      # later OIDC cutover declarative without changing the running service.
      - model: authentik_providers_oauth2.oauth2provider
        id: headscale-provider
        identifiers:
          name: Headscale
        attrs:
          authorization_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-authorization-implicit-consent]
          invalidation_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-invalidation-flow]
          client_type: confidential
          client_id: headscale
          client_secret: !Env AUTHENTIK_OIDC_HEADSCALE_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://headscale.rcrumana.xyz/oidc/callback
              redirect_uri_type: authorization
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          refresh_token_threshold: seconds=0
          include_claims_in_id_token: true
          sub_mode: user_uuid
          issuer_mode: per_provider
          property_mappings:
            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-openid]
            - !KeyOf verified-email-scope
            - !Find
              - authentik_providers_oauth2.scopemapping
              - [managed, goauthentik.io/providers/oauth2/scope-profile]
            - !KeyOf groups-scope
          signing_key: !Find
            - authentik_crypto.certificatekeypair
            - [name, authentik Self-signed Certificate]

      - model: authentik_core.application
        id: headscale-application
        identifiers:
          slug: headscale
        attrs:
          name: Headscale
          provider: !KeyOf headscale-provider
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf headscale-application
          group: !Find [authentik_core.group, [name, headscale-users]]
          order: 0
