apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  labels:
    app: librechat
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: librechat
  template:
    metadata:
      annotations:
        librechat.rcrumana.xyz/config-revision: "2026-08-05-authentik-ready"
        linkerd.io/inject: enabled
        config.linkerd.io/skip-outbound-ports: "6379"
      labels:
        app: librechat
    spec:
      serviceAccountName: librechat
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: patch-silent-audio-embed
          image: harbor.rcrumana.xyz/proxy-ghcr/danny-avila/librechat:v0.8.7@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              expected='src:`assets/silence.mp3`,allow:`autoplay`,id:`audio`,title:`audio-silence`'
              set -- $(grep -rlF "$expected" /app/client/dist/assets)
              if [ "$#" -ne 1 ]; then
                echo "expected exactly one LibreChat silent-audio iframe bundle, found $#" >&2
                exit 1
              fi

              source_bundle="$1"
              source_name="$(basename "$source_bundle")"
              patched_name="${source_name%.js}.silence-fix.js"
              patched_bundle="/patched-client-dist/assets/$patched_name"
              cp -a /app/client/dist/. /patched-client-dist/
              cp "/patched-client-dist/assets/$source_name" "$patched_bundle"
              sed -i \
                's#src:`assets/silence.mp3`,allow:`autoplay`,id:`audio`,title:`audio-silence`#srcDoc:`<audio autoplay src="/assets/silence.mp3"></audio>`,allow:`autoplay`,id:`audio`,title:`audio-silence`#' \
                "$patched_bundle"
              sed -i "s#./assets/$source_name#./assets/$patched_name#" /patched-client-dist/index.html

              grep -qF 'srcDoc:`<audio autoplay src="/assets/silence.mp3"></audio>`' "$patched_bundle"
              grep -qF "./assets/$patched_name" /patched-client-dist/index.html
              if grep -qF "./assets/$source_name" /patched-client-dist/index.html; then
                echo "LibreChat index still references its unpatched JavaScript bundle" >&2
                exit 1
              fi
              if grep -qF "$expected" "$patched_bundle"; then
                echo "LibreChat silent-audio iframe patch did not replace its target" >&2
                exit 1
              fi
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: patched-client-dist
              mountPath: /patched-client-dist
      containers:
        - name: librechat
          image: harbor.rcrumana.xyz/proxy-ghcr/danny-avila/librechat:v0.8.7@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3080
              name: http
          envFrom:
            - configMapRef:
                name: librechat-config
            - secretRef:
                name: librechat-secret
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-secret
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@valkey-cache-primary.databases.svc.cluster.local:6379
            - name: REDIS_URI
              value: redis://:$(REDIS_PASSWORD)@valkey-cache-primary.databases.svc.cluster.local:6379
          volumeMounts:
            - name: patched-client-dist
              mountPath: /app/client/dist
            - name: librechat-data
              mountPath: /app/uploads
            - name: librechat-yaml
              mountPath: /app/librechat.yaml
              subPath: librechat.yaml
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: librechat
      volumes:
        - name: patched-client-dist
          emptyDir:
            sizeLimit: 128Mi
        - name: librechat-data
          persistentVolumeClaim:
            claimName: librechat-data-critical
        - name: librechat-yaml
          configMap:
            name: librechat-yaml
