apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
data:
  HOST: "0.0.0.0"
  PORT: "3080"
  APP_TITLE: "LibreChat"
  DOMAIN: "https://chat.rcrumana.xyz"
  DOMAIN_CLIENT: "https://chat.rcrumana.xyz"
  DOMAIN_SERVER: "https://chat.rcrumana.xyz"
  ENDPOINTS: "custom,agents"
  OPENAI_API_BASE: "http://llm-gateway.ai.svc.cluster.local:4000/v1"
  SEARCH: "true"
  ALLOW_REGISTRATION: "false"
  ALLOW_EMAIL_LOGIN: "false"
  ALLOW_SOCIAL_LOGIN: "true"
  ALLOW_SOCIAL_REGISTRATION: "false"
  ALLOW_ACCOUNT_DELETION: "false"
  ALLOW_SHARED_LINKS: "true"
  ALLOW_SHARED_LINKS_PUBLIC: "false"
  SESSION_EXPIRY: "900000"
  REFRESH_TOKEN_EXPIRY: "86400000"
  OPENID_ISSUER: "https://auth.rcrumana.xyz/application/o/librechat/"
  OPENID_CLIENT_ID: "librechat"
  OPENID_SCOPE: "openid profile email groups"
  OPENID_CALLBACK_URL: "/oauth/openid/callback"
  OPENID_BUTTON_LABEL: "Continue with Rcrumana"
  OPENID_USE_PKCE: "true"
  OPENID_GENERATE_NONCE: "true"
  OPENID_REQUIRED_ROLE: "app-librechat"
  OPENID_REQUIRED_ROLE_PARAMETER_PATH: "groups"
  OPENID_REQUIRED_ROLE_TOKEN_KIND: "id"
  OPENID_ADMIN_ROLE: "platform-admins"
  OPENID_ADMIN_ROLE_PARAMETER_PATH: "groups"
  OPENID_ADMIN_ROLE_TOKEN_KIND: "id"
  OPENID_USERNAME_CLAIM: "preferred_username"
  OPENID_NAME_CLAIM: "name"
  OPENID_EMAIL_CLAIM: "email"
  OPENID_USE_END_SESSION_ENDPOINT: "true"
  OPENID_POST_LOGOUT_REDIRECT_URI: "https://chat.rcrumana.xyz/login"
  OPENID_AUTO_REDIRECT: "false"
  RAG_API_URL: "http://librechat-rag-api.ai.svc.cluster.local:8000"
  MEILI_HOST: "http://librechat-meilisearch.ai.svc.cluster.local:7700"
  USE_REDIS: "true"
