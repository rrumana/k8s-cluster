apiVersion: batch/v1
kind: Job
metadata:
  name: librechat-oidc-account-reset-20260805
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: librechat
      restartPolicy: Never
      containers:
        - name: reset
          image: harbor.rcrumana.xyz/proxy-dockerhub/library/mongo:8.3
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: librechat-secret
                  key: MONGO_URI
          command:
            - /bin/sh
            - -ec
            - |
              mongosh --quiet "$MONGO_URI" --eval '
                if (db.getName() !== "librechat") {
                  throw new Error(`refusing to reset unexpected database: ${db.getName()}`);
                }

                const users = db.users.countDocuments({});
                if (users === 0) {
                  print("LibreChat database already contains no accounts");
                  quit(0);
                }
                if (users !== 1) {
                  throw new Error(`refusing to reset unexpected account count: ${users}`);
                }

                print("removing the one existing LibreChat account and all application data");
                const result = db.dropDatabase();
                if (!result.ok) {
                  throw new Error(`database reset failed: ${tojson(result)}`);
                }
              '
