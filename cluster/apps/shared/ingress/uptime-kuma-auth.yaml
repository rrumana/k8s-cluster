apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma-auth
  namespace: productivity
  labels:
    security.rcrumana.xyz/exposure: public
    security.rcrumana.xyz/public-approved: "true"
    security.rcrumana.xyz/public-edge: direct
  annotations:
    haproxy-ingress.github.io/backend-protocol: "http"
    haproxy-ingress.github.io/ssl-redirect: "true"
    haproxy-ingress.github.io/config-backend-early: |
      http-request set-header X-Forwarded-Host %[req.hdr(host)]
      http-request set-header X-Forwarded-Proto https
      http-request set-header X-Original-URL https://%[req.hdr(host)]%[url]
    haproxy-ingress.github.io/config-backend: |
      http-response set-header X-Robots-Tag "noindex, nofollow"
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - uptime.rcrumana.xyz
      secretName: uptime-kuma-rcrumana-xyz-tls
  rules:
    - host: uptime.rcrumana.xyz
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-embedded-outpost
                port:
                  number: 80
