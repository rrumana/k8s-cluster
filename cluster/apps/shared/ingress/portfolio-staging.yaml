apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-staging
  namespace: web
  labels:
    security.rcrumana.xyz/exposure: public
    security.rcrumana.xyz/public-approved: "true"
    security.rcrumana.xyz/public-edge: cloudflare
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    haproxy-ingress.github.io/backend-protocol: "http"
    haproxy-ingress.github.io/timeout-client: "600s"
    haproxy-ingress.github.io/timeout-server: "600s"
    haproxy-ingress.github.io/allowlist-source-range: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32,192.168.0.0/16,172.16.0.0/12,10.0.0.0/8,100.64.0.0/10"
    haproxy-ingress.github.io/config-backend: |
      http-response set-header X-Robots-Tag "noindex, nofollow"
    haproxy-ingress.github.io/config-frontend: |
      acl is_html path_reg ^/(.+)\.html$
      acl skip_html_redirect path_beg /.well-known/
      http-request redirect code 301 location %[scheme]://%[req.hdr(host)]/%[path,regsub(^/(.+)\.html$,\1)]%[query,if,set(?%[query])] if is_html !skip_html_redirect
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - staging.rcrumana.xyz
      secretName: staging-rcrumana-xyz-tls
  rules:
    - host: staging.rcrumana.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-staging
                port:
                  number: 80
